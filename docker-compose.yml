services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pilo-postgres
    environment:
      POSTGRES_DB: pilo
      POSTGRES_USER: pilo
      # Local container on 127.0.0.1 only. Set PILO_DB_PASSWORD (and the matching
      # PILO_DATABASE_URL) before the first 'pilo up' to use your own.
      POSTGRES_PASSWORD: ${PILO_DB_PASSWORD:-pilo}
    ports:
      - "15432:5432"
    volumes:
      - pilo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilo -d pilo"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pilo-postgres:
