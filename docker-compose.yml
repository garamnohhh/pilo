services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pilo-postgres
    environment:
      POSTGRES_DB: pilo
      POSTGRES_USER: pilo
      # Never stored in the repository: bin/pilo passes the password from
      # ~/.pilo/config.toml, which is generated on first run.
      POSTGRES_PASSWORD: ${PILO_DB_PASSWORD:?run bin/pilo, or export it yourself}
    ports:
      - "15432:5432"
    volumes:
      - pilo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilo -d pilo"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pilo-postgres:
