<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilo dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pilo">
<!-- The tab and the installed app read the same files, so they cannot drift:
     icons/app-*.png are the handoff's own app icon (Pilo Wordmark.dc.html)
     rendered at each size, nothing redrawn. -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/app-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/app-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/app-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/app-192.png">
<link rel="stylesheet" href="/ds/styles.css">
<link rel="stylesheet" href="/desk.css">
<style>
  /* The faces are declared in ds/tokens/fonts.css, all of them served from
     here. IBM Plex is gone: its files carry Latin only, so every Korean word on
     this screen was drawn by whatever the machine happened to have. */

  :root {
    /* Names the unported screens still use, pointed at the system's tokens. */
    --panel: var(--surface); --panel2: var(--bg-2); --line2: var(--line);
    --strong: var(--text); --muted: var(--text-2); --faint: var(--text-3);
    --green: var(--accent); --amber: var(--warn); --red: var(--err); --blue: var(--info);
    --mono: var(--font-mono);
  }
  * { box-sizing: border-box }
  /* desk.css asks the container queries about .d-host; here the whole window is
     that container, which is what the handoff's artboard measured. */
  body { container-type: inline-size }
  [hidden] { display: none !important }
  /* Work fills the main area: the feed scrolls, the composer stays put. */
  main.d-main { padding: 0; overflow: hidden; position: relative }
  /* The bar down the left of a line, and its pulse. The TUI flips this colour
     to a dimmer one every 550 ms — a step, not a fade, and never to nothing —
     so a full cycle is 1.1s and the dim is 55% of the bright. The bar is its
     own element so only it moves; the words hold still. */
  .d-bar { width: 2px; flex: none; align-self: stretch }
  /* The sidebar spinner: a fixed box one glyph wide so a name never moves. */
  .d-spin, .d-spin-still { display: inline-block; width: 10px; flex: none; text-align: center; font: 14px/1 var(--mono) }
  .d-spin::before { content: "⠋"; animation: d-spin 1.2s steps(1, end) infinite }
  @keyframes d-spin {
    0% { content: "⠋" } 10% { content: "⠙" } 20% { content: "⠹" } 30% { content: "⠸" } 40% { content: "⠼" }
    50% { content: "⠴" } 60% { content: "⠦" } 70% { content: "⠧" } 80% { content: "⠇" } 90% { content: "⠏" }
  }
  @media (prefers-reduced-motion: reduce) { .d-spin::before { animation: none } }

  /* Every page's title row stays in view while the page scrolls under it. The
     row reaches up over the page's top padding so nothing shows above it. */
  .d-scroll.d-pad, .d-fill.d-pad { --d-pad-top: 24px }
  .d-scroll.d-pad > .d-head:first-child, .d-fill.d-pad > .d-head:first-child {
    position: sticky; top: calc(var(--d-pad-top) * -1); z-index: 4; background: var(--bg);
    margin-top: calc(var(--d-pad-top) * -1); padding-top: var(--d-pad-top); padding-bottom: 12px; margin-bottom: 12px }
  @container (max-width: 900px) { .d-scroll.d-pad, .d-fill.d-pad { --d-pad-top: 16px } }

  /* Requests holds still: the agent list, the request list and the handling
     each scroll inside themselves. Too narrow for side-by-side panes, the page
     scrolls as one instead. */
  .d-fill { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden }
  .d-fill > .d-split { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); align-items: stretch }
  .d-reqcol { min-width: 0; min-height: 0; display: flex; flex-direction: column }
  .d-reqcol > .d-lblrule { flex: none }
  .d-byagent { flex: 0 1 auto; min-height: 120px; max-height: 38%; overflow-y: auto }
  .d-reqsec { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 48px }
  .d-reqlist { flex: 1; min-height: 0; overflow-y: auto }
  .d-handling { min-width: 0; min-height: 0; overflow-y: auto }
  @container (max-width: 1180px) {
    .d-fill { overflow-y: auto }
    .d-fill > .d-split { flex: none; grid-template-rows: none }
    .d-byagent { max-height: 320px }
    .d-reqlist { flex: none; max-height: 480px }
    .d-handling { overflow: visible }
  }

  /* Usage in the topbar, where the TUI keeps it: mark, then the figure. Narrow keeps the figure only. */
  .d-usage-row { display: flex; align-items: center; gap: 12px }
  .d-usage { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap }
  .d-usage-short { display: none }
  @media (max-width: 780px) { .d-usage-full { display: none } .d-usage-short { display: inline } }

  /* One pulse for everything live: the bar under a conversation and the dot
     beside an agent, at the TUI's own beat. desk.css carries the handoff's
     .d-live at 1.06 s down to 25%; beside a 1.1 s bar those two drift a whole
     cycle apart every half-minute, so the dot is put on this beat too. */
  @keyframes d-pulse { 0%, 49.99% { opacity: 1 } 50%, 100% { opacity: 0.55 } }
  .d-live, .d-bar-live { animation: d-pulse 1.1s steps(1, end) infinite }
  @media (prefers-reduced-motion: reduce) { .d-live, .d-bar-live { animation: none } }

  /* Rendered markdown. Code blocks and tables wear the design system's own
     .gn-code and .gn-table; everything here is spacing and the inline marks. */
  .md > *:first-child { margin-top: 0 }
  .md > *:last-child { margin-bottom: 0 }
  .md .md-p { margin: 0 0 10px }
  .md .md-block { margin: 0 0 12px }
  .md .md-h { margin: 16px 0 8px; font-weight: 600; letter-spacing: -0.01em; color: var(--text) }
  .md .md-h1 { font-size: 17px } .md .md-h2 { font-size: 15.5px } .md .md-h3 { font-size: 14.5px }
  .md .md-h4, .md .md-h5, .md .md-h6 { font-size: 13.5px; color: var(--text-2) }
  .md .md-list { margin: 0; padding-left: 20px }
  .md .md-list .md-list { margin: 4px 0 }
  .md .md-list li { margin: 3px 0 }
  .md .md-quote { margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 2px solid var(--line); color: var(--text-3) }
  .md .md-rule { margin: 14px 0; border-top: var(--bw) solid var(--line) }
  .md .md-code { font-family: var(--font-mono); font-size: 0.92em; padding: 1px 5px; background: var(--bg-2); color: var(--text) }
  .md .md-pre { margin: 0; padding: 10px 14px; white-space: pre; overflow-x: auto; font-size: 12.5px; line-height: 1.75 }
  .md .gn-code { margin: 0 0 12px }
  /* A wide table or a long line scrolls inside its own block, never the page. */
  .md .md-scroll { overflow-x: auto }
  .md .md-table { min-width: 100%; width: max-content }
  .md .md-table th, .md .md-table td { white-space: nowrap }
  .md a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px }
  /* In a result the body is --text-2 and this is --text, so bold is told apart
     by colour as much as weight. An answer is already at --text and there is
     nothing brighter to move to, which is why bold read flat there: weight was
     the only cue. 700 makes that cue carry — 35.7% more ink than 400 against
     600's 25.1%, measured on Korean at 15px. */
  .md strong { font-weight: 700; color: var(--text) }
  /* Only shown while the conversation has moved on without you. */
  #newlines { position: absolute; left: 50%; transform: translateX(-50%); bottom: 74px; z-index: 30 }
  /* The handoff has no count on the rail at all, so this is new: the values are
     .gn-badge's own (mono, --fs-label, the warn and err hues), sat on the
     icon's corner where it still reads when the rail is only icons. */
  .d-railmark { position: relative; display: block; width: 22px; height: 22px }
  .d-railbadge { position: absolute; top: -5px; right: -9px; min-width: 16px; height: 15px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 9px; line-height: 1; letter-spacing: 0;
    color: var(--on-accent); border: var(--bw) solid var(--bg) }
  main.d-main > #view { flex: 1; min-height: 0; display: flex; flex-direction: column }
  main.d-main > header { margin: 0; padding: 24px 28px 14px }
  /* screens that have not been ported yet keep their own scrolling */
  main.d-main > #view:not(:has(.d-composer)) { overflow-y: auto; padding: 0 28px 40px }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased }
  button, input, select, textarea { font: inherit; color: inherit }
  .mono { font-family: var(--mono) }
  html, body { height: 100%; overflow: hidden }
  .topbar { flex: none; z-index: 20; display: flex; align-items: center; gap: 28px; padding: 14px 28px;
    background: rgba(8, 9, 10, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line) }
  .topbar .mark { font: 600 17px var(--mono); letter-spacing: -.03em; color: var(--strong) }
  .topbar .tag { font: 11px var(--mono); color: #5f6b64 }
  .topbar .state { margin-left: auto; display: flex; align-items: center; gap: 14px; font: 11px var(--mono); color: var(--muted) }
  body { display: flex; flex-direction: column }
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px 1fr }

  aside { border-right: 1px solid var(--line); background: var(--panel2); padding: 22px 12px;
    display: flex; flex-direction: column; overflow: hidden }
  .eyebrow { font: 10px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; padding: 0 10px 12px }
  .tab { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; margin-bottom: 2px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: #6f7a73; font-size: 13px; text-align: left; cursor: pointer }
  .tab:hover { background: #121615; color: var(--text) }
  .tab.active { background: #121615; border-color: #232b28; color: var(--text) }
  .tab .num { font: 11px var(--mono); color: var(--faint); width: 16px }
  .badge { margin-left: auto; font: 10px var(--mono); padding: 2px 7px; border-radius: 999px; background: #151a18 }
  .side-card { margin-top: auto; padding: 14px 12px; border: 1px solid var(--line); border-radius: 9px; background: #0d100f; font: 11px var(--mono); color: #9aa59d }
  .side-card .sub { margin-top: 7px; font-size: 10px; line-height: 1.7; color: var(--faint) }

  main { padding: 30px 32px 60px; overflow-y: auto; overflow-x: hidden; min-height: 0 }
  header { position: sticky; top: -30px; z-index: 10; display: flex; align-items: flex-end; gap: 16px;
    margin: -30px -32px 24px; padding: 30px 32px 14px; background: var(--bg) }
  h1 { margin: 0 0 5px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; color: var(--strong) }
  header p { margin: 0; font-size: 13px; color: var(--muted) }
  .pill { font: 11px var(--mono); padding: 7px 12px; border-radius: 7px; border: 1px solid #1e2422; color: var(--muted); white-space: nowrap }

  .card { padding: 18px 20px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel) }
  .card h2 { margin: 0 0 4px; font-size: 13px; font-weight: 500; color: var(--text) }
  .card p.hint { margin: 0 0 14px; font-size: 12px; line-height: 1.6; color: var(--muted) }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px }
  .grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; margin-bottom: 12px }
  .split { display: grid; grid-template-columns: 1fr 400px; gap: 14px }
  .half { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
  .label { font: 10px var(--mono); letter-spacing: .1em; color: #5f6b64; text-transform: uppercase }
  .value { font: 500 24px var(--mono); color: var(--strong) }
  .sub { font-size: 11px; color: #67726b }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none }
  .row { display: grid; align-items: center; padding: 11px 16px; border-bottom: 1px solid #121615; font-size: 12px; color: #9aa59d }
  .row:hover { background: #101413 }
  .head { font: 10px var(--mono); letter-spacing: .1em; color: var(--faint); text-transform: uppercase; border-bottom: 1px solid #171b19; padding: 9px 16px }
  .table { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--panel) }
  .table .title { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid #171b19; font-size: 13px; color: var(--text); font-weight: 500 }
  .inbox { display: grid; grid-template-columns: 340px 1fr; gap: 14px; height: calc(100vh - 190px); min-height: 340px }
  .inbox > * { overflow-y: auto; min-height: 0 }
  .inbox .table { display: flex; flex-direction: column }
  .inbox .table .title { position: sticky; top: 0; background: var(--panel); z-index: 1 }
  .daygroup { padding: 8px 16px; font: 10px var(--mono); letter-spacing: .1em; color: var(--faint);
    text-transform: uppercase; background: var(--panel2); border-bottom: 1px solid #121615; position: sticky; top: 43px }
  .step { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid #171b19 }
  .step .body { font-size: 12.5px; line-height: 1.65; color: #b9c3bc; white-space: pre-wrap }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line) }
  .chip { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: transparent;
    color: var(--faint); font: 10px var(--mono); cursor: pointer }
  .chip:hover { color: var(--text) }
  .chip.on { border-color: #2f5f4c; color: var(--green) }
  .step .body.short { max-height: 3.4em; overflow: hidden; mask-image: linear-gradient(#000 50%, transparent) }
  .empty { padding: 34px 16px; color: var(--faint); font: 12px var(--mono); text-align: center }

  .btn { font: 11px var(--mono); padding: 6px 11px; border-radius: 6px; border: 1px solid var(--line2); background: #131817; color: #9aa59d; cursor: pointer; white-space: nowrap }
  .btn:hover { color: var(--strong); border-color: #3a4540 }
  .btn.small { font-size: 10px; padding: 4px 8px; background: var(--panel2) }
  .btn.danger:hover { color: var(--red); border-color: #3a2a28 }
  .btn.primary { width: 100%; padding: 10px; font-size: 12px; border-color: #2b3531; background: #151a18; color: var(--strong) }
  .btn[disabled] { opacity: .45; cursor: not-allowed }
  .btn.wide { width: 100% }

  .field { margin-bottom: 13px }
  .field .name { display: flex; align-items: baseline; gap: 7px; margin-bottom: 6px; font: 11px var(--mono); color: #9aa59d }
  .field .name .hint { font-size: 10px; color: var(--faint) }
  .field .name .req { margin-left: auto; font-size: 10px; color: var(--red) }
  .field input, .field select, .field textarea { width: 100%; font: 12px var(--mono); padding: 9px 11px; border-radius: 7px; border: 1px solid #1e2422; background: var(--panel2); color: #e6ebe6; outline: none }
  .field input:focus, .field select:focus { border-color: #3a4540 }
  .choices { display: flex; gap: 6px }
  .choice { position: relative; flex: 1; font: 11px var(--mono); padding: 8px 6px; border-radius: 7px; border: 1px solid #1e2422; background: var(--panel2); color: #6f7a73; cursor: pointer }
  .choice.on { border-color: #3a4540; background: #151a18; color: var(--strong) }
  .choice small { display: block; margin-top: 3px; font-size: 9px; color: var(--faint) }

  .node { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-radius: 10px; border: 1px solid #1e2422; background: #0d100f }
  .node.root { display: inline-flex; border-color: #24312c; background: linear-gradient(180deg, #101413, #0b0e0d) }
  .node .name { font: 13px var(--mono); color: var(--strong) }
  .node .meta { font: 11px var(--mono); color: #5f6b64 }
  .node .acts { margin-left: auto; display: flex; gap: 6px }
  .role { font: 9px var(--mono); letter-spacing: .08em; padding: 3px 7px; border-radius: 3px; border: 1px solid #232b28 }
  .role.pilo { color: var(--green); border-color: #24312c }
  .role.pm { color: var(--blue); border-color: #232b31 }
  .role.worker { color: var(--muted); border-color: #1e2422 }
  .branch { margin: 4px 0 0 26px; border-left: 1px solid #1e2422; padding-left: 22px }
  .branch .node::before { content: ""; position: absolute; left: -22px; top: 50%; width: 22px; height: 1px; background: #1e2422 }

  .list-item { position: relative; display: block; width: 100%; text-align: left; padding: 13px 15px; border: none; border-bottom: 1px solid #121615; background: transparent; cursor: pointer; color: inherit }
  .list-item:hover { background: #101413 }
  .list-item.on { background: #121615; box-shadow: inset 2px 0 0 var(--green) }
  .code { padding: 16px; overflow: auto; max-height: 320px; font: 12px/1.85 var(--mono) }
  .code .ln { display: flex; gap: 16px }
  .code .n { color: #2f3634; width: 24px; text-align: right; flex: none }
  .code .t { white-space: pre }
  .toggle { width: 30px; height: 17px; border-radius: 999px; border: none; padding: 0; position: relative; cursor: pointer }
  .toggle span { position: absolute; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--panel2) }
  .note { margin-top: 14px; padding: 11px 13px; border-radius: 8px; border: 1px dashed #232927; font: 10px/1.8 var(--mono); color: #5f6b64 }
  .fail { padding: 18px; border: 1px solid oklch(0.40 0.10 25 / .35); border-radius: 11px; background: oklch(0.26 0.05 25 / .14) }
  .fail .item { margin-top: 12px; padding: 12px; border-radius: 9px; background: #0b0d0c; border: 1px solid #1e2422 }
  table.md { border-collapse: collapse; margin: 8px 0; font: 11px var(--mono); width: 100%; display: block; overflow-x: auto }
  table.md th, table.md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; white-space: nowrap }
  table.md th { background: var(--panel2); color: var(--text); font-weight: 500 }
  table.md td { color: #b9c3bc }
  .toast { position: fixed; right: 20px; bottom: 20px; padding: 11px 15px; border-radius: 9px; border: 1px solid var(--line2); background: #101413; font: 12px var(--mono); color: var(--text); opacity: 0; transition: opacity .18s; pointer-events: none }
  .toast.show { opacity: 1 }
  .toast.bad { border-color: #3a2a28; color: #f0c2b8 }
  a { color: var(--green); text-decoration: none }
  @media (max-width: 1100px) { .split, .half, .grid2 { grid-template-columns: 1fr } .grid4 { grid-template-columns: repeat(2, 1fr) } }
  @media (max-width: 780px) { .app { grid-template-columns: 1fr } aside { display: none } main { padding: 20px } }
</style>
</head>
<body>
<div class="d-top">
  <span class="d-mark"><b>❯</b>pilo</span>
  <span style="margin-left:auto;display:flex;align-items:center;gap:16px" id="topstate"></span>
  <span class="d-m" id="sync" style="font-size:11px;color:var(--text-3);flex:none">loading…</span>
</div>
<div class="d-shell" id="shell">
  <div class="d-rail" id="rail"></div>
  <div class="d-strip" id="strip" hidden></div>
  <div class="d-agents" id="tree" hidden></div>
  <main class="d-main">
    <section id="view"></section>
    <button class="gn-btn gn-btn-sm" id="newlines" data-act="to-end" hidden></button>
  </main>
</div>
<div id="dlg"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { renderMarkdown } from "/markdown.js";
import { TUI_COMMANDS, CLI_COMMANDS } from "/commands.js";
import { t, LANGS } from "/text.js";
// The rail, from the design handoff. Each row is [screen, plain glyph, codicon]:
// the codicon needs the patched JetBrains Mono that ships in fonts/, the plain
// one is what a machine without it falls back to.
const RAIL = [
  ["work", "\u276F", "\uEC0F", "work"],
  ["agents", "\u2733", "\uEC67", "agents"],
  ["inbox", "\u25A4", "\uEB09", "requests"],
  ["schedules", "\u25F7", "\uEC75", "schedules"],
  ["events", "\u007E", "\uEB31", "events"],
  ["artifacts", "\u25C6", "\uEAE9", "artifacts"],
  ["projects", "\u25AA", "\uEA83", "projects"],
  ["commands", "\u003A", "\uEA85", "commands"],
  ["settings", "\u2261", "\uEAF8", "settings"],
  ["system", "\u25CF", "\uEBA2", "system"]
];

// "overview" is out of the rail — the numbers it carried are in the work strip
// and the runtime rows are on System. The view itself is left in place so it can
// come back by putting the key back in RAIL.

const state = {
  tab: location.hash.slice(1) || "work",
  data: {},
  form: emptyForm(),
  editing: null,
  candidates: [],
  rules: null,
  openTrace: null,
  selected: { event: null, artifact: null, inbox: null },
  inboxFilter: null,
  project: { id: null, name: "", repo: "", path: "", note: "" },
  schedule: { name: "", toAgentId: "", request: "", cadence: "09:00", weekdaysOnly: true, onMiss: "run" },
  runs: { open: null, rows: [] },
  // The conversation list behind Work: a page at a time, newest first, with the
  // ones the reader has opened or shut on top of the newest-two rule.
  feed: { agent: "", rows: [], done: false, loading: false, prepended: false, open: new Set(), shut: new Set(), detail: {} },
  dlg: null,
  // Every request, not only the open ones: the screen is where finished work
  // is read back, and the newest ten are on Work either way.
  reqFilter: "All",
  reqAgent: "",
  eventFilter: "all",
  theme: "dark",
  lang: "en",
  palette: false,
  palQuery: "",
  draft: "",
  sending: false,
  fold: {}
};

function emptyForm() {
  return { name: "", role: "pm", parentAgentId: "", projectId: "", projectName: "", cwd: "", specialty: "", aliases: "", note: "", model: "", runtime: "", writeRules: true };
}

const $ = (id) => document.getElementById(id);

// The design's own two switches. The theme is a data attribute the token file
// already answers to; the language picks which of text.js's two tables t()
// reads, so every string that has a key follows it. Labels drawn verbatim from
// the handoff stay English in both, exactly as the handoff shows them.
function setTheme(mode) {
  state.theme = mode === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  try { localStorage.setItem("pilo-theme", state.theme); } catch (err) { /* private window */ }
}

function setLang(code) {
  state.lang = LANGS[code] ? code : "en";
  document.documentElement.lang = state.lang;
  try { localStorage.setItem("pilo-lang", state.lang); } catch (err) { /* private window */ }
}

const T = (key, vars = {}) => {
  const table = LANGS[state.lang] || LANGS.en;
  const line = table[key] ?? LANGS.en[key] ?? key;
  return String(line).replace(/\{(\w+)\}/g, (_, name) => (vars[name] === undefined ? `{${name}}` : String(vars[name])));
};
// Agent prose often carries markdown tables; show them as tables.
// Agents write markdown. src/markdown.js escapes first and only then writes
// tags, so nothing in an agent's words can become one.
const prose = (text) => renderMarkdown(text, esc);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const time = (v) => (v ? new Date(v).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "—");
const stamp = (v) => (v ? new Date(v).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—");
const stateColor = (s) => ({ failed: "var(--red)", down: "var(--red)", running: "var(--amber)", degraded: "var(--amber)", blocked: "var(--blue)", queued: "var(--faint)", archived: "var(--faint)", unbound: "var(--faint)" }[s] || "var(--green)");

let toastTimer;
function toast(message, bad = false) {
  const el = $("toast");
  el.textContent = message;
  el.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = "toast"), 2600);
}

async function call(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(payload.error || `${method} ${path} failed`);
  return payload;
}
const get = (path) => call("GET", path);

async function load() {
  const [overview, tree, projects, inbox, events, artifacts, settings, system, setup, sessions, agents, schedules, quota] = await Promise.all([
    get("/api/overview"), get("/api/agents/tree"), get("/api/projects"), get("/api/inbox"),
    get("/api/events"), get("/api/artifacts"), get("/api/settings"), get("/api/system"), get("/api/setup"),
    get("/api/sessions"), get("/api/agents"), get("/api/schedules"), get("/api/quota").catch(() => ({}))
  ]);
  state.data = { ...state.data, overview, tree, projects, inbox, events, artifacts, settings, system, setup, sessions, agents, schedules, quota };
  refreshFeed();
  await loadDetail();
  $("sync").textContent = "updated " + new Date().toLocaleTimeString("ko-KR");
  render();
}

// The request pane keeps its own selection, so refresh it alongside the list.
// The dialogs fetch their own detail when they open, and again while they stay
// open so a running task's numbers move.
async function loadDetail() {
  const list = state.data.inbox || [];
  // Work reads the same detail: the conversation is the newest request in full.
  if (state.tab === "inbox" || state.tab === "work") {
    const id = list.some((x) => String(x.id) === String(state.selected.inbox)) ? state.selected.inbox : list[0]?.id;
    state.selected.inbox = id ?? null;
    state.data.inboxDetail = id ? await get(`/api/inbox/${id}`) : null;
  }
  if (state.tab === "work") {
    if (state.feed.agent && !state.feed.rows.length) state.feed.rows = await feedPage(null);
    else if (state.feed.agent) {
      const fresh = await feedPage(null);
      const known = new Set(state.feed.rows.map((row) => String(row.id)));
      state.feed.rows = [...fresh.filter((row) => !known.has(String(row.id))),
        ...state.feed.rows.map((row) => fresh.find((x) => String(x.id) === String(row.id)) || row)];
    }
    await loadOpenDetails();
  }
  if (state.tab === "schedules") state.data.recentRuns = await recentRuns();
  if (state.dlg?.kind === "event") state.data.eventDetail = await get(`/api/events/${state.dlg.id}`);
  if (state.dlg?.kind === "artifact") state.data.artifactDetail = await get(`/api/artifacts/${state.dlg.id}`);
  if (state.dlg?.kind === "schedule") state.runs = { open: state.dlg.id, rows: await get(`/api/schedules/${state.dlg.id}/runs`) };
}

// Ten conversations at a time. 787 of them are on this machine and a page of
// ten costs about 45 KB, so the whole list would be some 3.5 MB — the newest
// ten, and ten more each time you reach the top, is what the reader can use.
const PAGE = 10;
const OPEN_BY_DEFAULT = 2;

// Rows for the unfiltered feed come out of the list load() already made, so the
// first fifty conversations cost no request at all; past that, and whenever an
// agent is picked, the server is asked for the next page.
// Whether this request is one the agent took part in. The server answers this
// properly — it can see who wrote the answer as well as who was handed the work
// — and this is the same question asked of what is already in hand.
function feedMatches(row, agent) {
  if (!agent) return true;
  const names = routedNames(row);
  if (names.includes(agent)) return true;
  return !names.length && agent === (state.data.tree?.pilo?.name || "pilo");
}

async function feedPage(before) {
  const f = state.feed;
  const q = new URLSearchParams({ limit: String(PAGE) });
  if (before) q.set("before", String(before));
  if (f.agent) q.set("agent", f.agent);
  let rows = await get(`/api/inbox?${q}`);
  // A server still running the code it started with does not know these three
  // words and hands back its own fifty. Cut them down here so the feed behaves
  // either way; a restart is what makes the paging exact.
  if (rows.length > PAGE || (f.agent && rows.some((row) => !feedMatches(row, f.agent)))) {
    rows = rows
      .filter((row) => (!before || Number(row.id) < Number(before)) && feedMatches(row, f.agent))
      .slice(0, PAGE);
  }
  if (rows.length < PAGE) f.done = true;
  return rows;
}

// Whatever load() just fetched is the freshest copy of the newest fifty, so the
// rows already on screen take their live fields from it rather than asking again.
function refreshFeed() {
  const f = state.feed;
  if (f.agent) return;
  const all = state.data.inbox || [];
  if (!f.rows.length) { f.rows = all.slice(0, PAGE); return; }
  const fresh = new Map(all.map((row) => [String(row.id), row]));
  f.rows = f.rows.map((row) => fresh.get(String(row.id)) || row);
  // Only what is newer than the top of the list has actually arrived; the rest
  // of load()'s fifty is older, and belongs to the pages not asked for yet.
  const newest = Number(f.rows[0]?.id ?? 0);
  const arrived = all.filter((row) => Number(row.id) > newest);
  if (arrived.length) f.rows = [...arrived, ...f.rows];
}

// One page per arrival at the top. The flag is held until the scroll position
// has been corrected, or the events that fire while it is being corrected would
// each ask for another page and the whole list would come in at once.
async function loadOlder() {
  const f = state.feed;
  if (f.loading || f.done) return;
  f.loading = true;
  const pool = f.agent ? [] : (state.data.inbox || []);
  const oldest = f.rows[f.rows.length - 1];
  const at = oldest ? pool.findIndex((row) => String(row.id) === String(oldest.id)) : -1;
  try {
    if (at >= 0 && at + 1 < pool.length) {
      // Still inside the fifty rows load() holds — take the next ten from there.
      f.rows = [...f.rows, ...pool.slice(at + 1, at + 1 + PAGE)];
    } else {
      render();
      const rows = await feedPage(oldest?.id);
      const known = new Set(f.rows.map((row) => String(row.id)));
      f.rows = [...f.rows, ...rows.filter((row) => !known.has(String(row.id)))];
    }
  } catch (err) {
    toast(err.message, true);
  } finally {
    f.prepended = true;
    render();
    await loadOpenDetails();
    f.loading = false;
  }
}

// A conversation the reader opened needs its tasks and its answer; one that is
// finished never changes again, so it is fetched once and kept.
async function loadOpenDetails() {
  const f = state.feed;
  const refreshed = new Set((state.data.inbox || []).map((row) => String(row.id)));
  const wanted = f.rows.filter((row, i) =>
    !folded(row.id, i) || (!refreshed.has(String(row.id)) && !convState(row, f.detail[row.id]).answered));
  for (const row of wanted) {
    const held = f.detail[row.id];
    // Kept only once the detail itself says it is over; the row saying so is
    // exactly when the detail needs fetching again.
    if (held && held.status === "replied" && (held.replies || []).length) continue;
    try {
      f.detail[row.id] = await get(`/api/inbox/${row.id}`);
    } catch (err) { /* it may have gone; the summary still reads */ }
  }
}

function folded(id, fromNewest) {
  const key = String(id);
  if (state.feed.open.has(key)) return false;
  if (state.feed.shut.has(key)) return true;
  return fromNewest >= OPEN_BY_DEFAULT;
}

// There is no endpoint for "every run"; the runs of each schedule are read and
// merged, newest first.
async function recentRuns() {
  const schedules = state.data.schedules || [];
  const lists = await Promise.all(schedules.slice(0, 8).map(async (s) => {
    const rows = await get(`/api/schedules/${s.id}/runs`).catch(() => []);
    return rows.map((r) => ({ ...r, schedule: s.name }));
  }));
  return lists.flat().sort((a, b) => new Date(b.firedAt) - new Date(a.firedAt)).slice(0, 12);
}

function railHtml() {
  const badges = {
    inbox: state.data.inbox?.filter((i) => i.status !== "replied").length || 0,
    system: state.data.system?.wakeFailures?.length || 0 // already filtered to unresolved
  };
  return RAIL.map(([key, plain, icon]) => {
    const badge = badges[key];
    const label = T(`desk.rail.${key}`);
    return `<button class="d-railbtn" aria-current="${state.tab === key ? "page" : "false"}" data-tab="${key}" title="${label}${badge ? ` · ${badge}` : ""}">
      <span class="d-railmark">
        <span class="d-railicon" data-nf="on">${icon}</span>
        ${badge ? `<span class="d-railbadge" style="background:${key === "system" ? "var(--err)" : "var(--warn)"}">${badge > 99 ? "99+" : badge}</span>` : ""}
      </span>
      <span class="d-railtxt">${label}</span>
    </button>`;
  }).join("") + `<div style="margin-top:auto;padding:10px 8px;border-top:var(--bw) solid var(--line)">
      <button class="d-plain d-m" style="width:100%;font-size:9px;color:var(--line);text-align:center;line-height:1.5" data-act="open-palette">⌘K</button>
    </div>`;
}

// The TUI's usage line, cell for cell: the server works each one out with the
// TUI's rule (src/quota.js), so "53% ↻19:10", the dimmed old reading, "?" and
// nothing-at-all all match. The weekly figure and the reading's age go in the hover.
function usageHtml() {
  const quota = state.data.quota || {};
  const cells = ["claude", "codex"].filter((rt) => quota[rt]).map((rt) => {
    const u = quota[rt];
    const colour = u.dim ? "var(--text-3)" : u.percent >= 90 ? ERR : u.percent >= 70 ? WARN : OK;
    const hint = `${rt} · 5h ${u.text}${u.week != null ? ` · week ${u.week}%` : ""}${u.ageMin != null ? ` · read ${u.ageMin}m ago` : ""}`;
    return `<span class="d-m d-usage" title="${esc(hint)}" style="color:${colour}">${runtimeMark(rt)}` +
      `<span class="d-usage-full">${esc(u.text)}</span><span class="d-usage-short">${esc(u.compact)}</span></span>`;
  });
  return cells.length ? `<span class="d-usage-row">${cells.join("")}</span>` : "";
}

function topstateHtml() {
  const st = state.data.overview?.stats || {};
  const server = state.data.system?.services?.find((x) => x.name === "server");
  const waiting = st.inboxToday?.pending ?? 0;
  return `
    <span class="d-m" style="font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px">
      <span class="d-dot${server?.state === "running" ? " d-live" : ""}" style="background:${stateColor(server?.state)}"></span>${esc(server?.state || "unknown")}</span>
    <span class="d-m" style="font-size:12px;color:var(--text-3)">${st.agents ?? 0} agents</span>
    ${waiting ? `<span class="d-m" style="font-size:12px;color:var(--warn)">${waiting} waiting</span>` : ""}
    ${st.failed?.total ? `<span class="d-m" style="font-size:12px;color:var(--err)">${st.failed.total} failed</span>` : ""}
    ${usageHtml()}
    <button class="d-plain d-m" style="font-size:11px;color:var(--text-3);border:var(--bw) solid var(--line);padding:4px 8px" data-act="open-palette">⌘K</button>`;
  // The old sidebar's herdr card has no home in the rail; the same facts are on
  // the System screen, and the topbar already says whether the server is up.
}

// A refresh used to rebuild #view whether or not anything in it had changed,
// and a rebuilt element starts at scrollTop 0 — so every five seconds the page
// you were reading jumped back to the top. The fix is not to repaint at all
// unless the html actually differs; the scroll memory below is only for the
// times it really does.
const painted = {};

function paint(id, html) {
  if (painted[id] === html) return false;
  painted[id] = html;
  $(id).innerHTML = html;
  return true;
}

const SCROLLERS = [["tree", "#tree .d-scroll"], ["view", "#view .d-scroll"], ["dlg", "#dlg .d-dlgbody"],
  // requests: the page when it is too narrow for the panes, then each pane
  ["reqpage", "#view .d-fill"], ["byagent", "#view .d-byagent"], ["reqlist", "#view .d-reqlist"], ["handling", "#view .d-handling"]];
// A different request opens its handling at the top; the same one keeps its place.
let handlingFor = null;

function scrollState() {
  const saved = {};
  for (const [key, sel] of SCROLLERS) {
    const node = document.querySelector(sel);
    if (node) saved[key] = node.scrollTop;
  }
  return saved;
}

function restoreScroll(saved) {
  for (const [key, sel] of SCROLLERS) {
    const node = document.querySelector(sel);
    if (node && saved[key]) node.scrollTop = saved[key];
  }
}

// Work is a conversation, so it follows its newest line the way a chat window
// does — but only while you are already at the end of it. Scrolled up to read
// something, it stays where you left it and says how many lines came in.
const END_SLACK = 48;
const atEnd = (node) => node.scrollHeight - node.scrollTop - node.clientHeight <= END_SLACK;
const feedNode = () => (state.tab === "work" ? $("view").querySelector(".d-scroll") : null);

let pinned = true;
let unseen = 0;
let feedCount = -1;

function toEnd(node) {
  node.scrollTop = node.scrollHeight;
  // A face or an image can still be arriving; measure once more on the next frame.
  requestAnimationFrame(() => { node.scrollTop = node.scrollHeight; });
}

function watchFeed() {
  const node = feedNode();
  if (!node) return;
  node.onscroll = () => {
    pinned = atEnd(node);
    if (node.scrollTop < 240) loadOlder();
    if (pinned && unseen) {
      unseen = 0;
      showUnseen();
    }
  };
}

function showUnseen() {
  const pill = $("newlines");
  pill.hidden = !(state.tab === "work" && unseen > 0);
  if (!pill.hidden) pill.textContent = `${unseen} new ${unseen === 1 ? "line" : "lines"} ↓`;
}

// A CSS animation counts from the moment its element is drawn, so a dot drawn
// at one paint and a bar drawn at a later one blink out of step for good. Every
// live animation is pinned to the same origin on the document timeline instead.
// This runs when something has been painted, never on the beat itself.
function syncPulse() {
  for (const anim of document.getAnimations()) {
    if ((anim.animationName === "d-pulse" || anim.animationName === "d-spin") && anim.startTime !== 0) anim.startTime = 0;
  }
}

let renderedTab = null;

// A repaint replaces every element it covers, and the composer sits inside the
// feed's view. Refreshing used to stop outright while any field had focus: the
// words survived, but a new answer stayed off the screen until the cursor left.
// Now typed words, the cursor and focus are carried across the repaint, and a
// repaint that would land in the middle of Hangul composition waits for the
// syllable to be finished.
let composing = false;
let owedRender = false;
const endComposition = () => {
  composing = false;
  if (!owedRender) return;
  owedRender = false;
  render();
};
document.addEventListener("compositionstart", () => { composing = true; });
document.addEventListener("compositionend", endComposition);
document.addEventListener("focusout", () => { if (composing) endComposition(); });

function holdFields() {
  const fields = [...document.querySelectorAll("input[id], textarea[id]")]
    .filter((el) => el.type !== "checkbox" && el.type !== "radio" && el.value !== el.defaultValue)
    .map((el) => ({ id: el.id, value: el.value }));
  const el = document.activeElement;
  const focus = el?.id && ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName)
    ? { id: el.id, start: el.selectionStart, end: el.selectionEnd, dir: el.selectionDirection, top: el.scrollTop }
    : null;
  return { fields, focus };
}

function returnFields({ fields, focus }) {
  // Only a field drawn fresh takes the words back; one left in place still has them.
  for (const field of fields) {
    const el = $(field.id);
    if (el && el.value === el.defaultValue && el.value !== field.value) el.value = field.value;
  }
  const el = focus && $(focus.id);
  if (!el || el === document.activeElement) return;
  el.focus({ preventScroll: true });
  try {
    el.setSelectionRange(focus.start, focus.end, focus.dir);
  } catch (err) { /* not a text field */ }
  el.scrollTop = focus.top;
}

function render() {
  if (composing) {
    owedRender = true;
    return;
  }
  const held = holdFields();
  const tabChanged = renderedTab !== state.tab;
  const saved = tabChanged ? {} : scrollState();
  const before = feedNode();
  const gap = before ? before.scrollHeight - before.scrollTop : 0;
  const wasPinned = tabChanged ? true : pinned;
  const isWork = state.tab === "work";

  let touched = paint("rail", railHtml()) | paint("topstate", topstateHtml());
  $("shell").dataset.work = isWork ? "on" : "off";
  $("strip").hidden = !isWork;
  $("tree").hidden = !isWork;
  if (isWork) touched |= renderWorkPanes();
  const viewChanged = paint("view", views[state.tab]());
  touched |= viewChanged | paint("dlg", dialogHtml() + paletteHtml());

  if (viewChanged && !tabChanged) restoreScroll(saved);
  const reading = state.tab === "inbox" ? String(state.selected.inbox ?? "") : null;
  if (reading !== null && reading !== handlingFor) {
    const pane = document.querySelector("#view .d-handling");
    if (pane) pane.scrollTop = 0;
  }
  handlingFor = reading;
  if (touched) {
    if (isWork) restoreDraft();
    wire();
    watchFeed();
    syncPulse();
    returnFields(held);
  }
  renderedTab = state.tab;

  const feed = feedNode();
  if (feed) {
    const count = feedSize();
    if (state.feed.prepended) {
      // Older conversations went in above; hold the same distance from the end
      // so the line being read does not move.
      feed.scrollTop = feed.scrollHeight - gap;
      state.feed.prepended = false;
    } else if (tabChanged) {
      pinned = true;
      unseen = 0;
      toEnd(feed);
    } else if (viewChanged && wasPinned) {
      toEnd(feed);
    } else if (viewChanged && feedCount >= 0 && count > feedCount) {
      unseen += count - feedCount;
    }
    feedCount = count;
  } else {
    feedCount = -1;
  }
  showUnseen();
}

// The composer posts to the same endpoint the TUI does, so a line typed here
// and a line typed there arrive as the same kind of request.
//
// Long pastes and images go in the TUI's way too. The draft holds a marker —
// ⟦paste #1 · 40 lines · 2.3k chars⟧ or ⟦image #1 · 1280×720 · png 342KB⟧ — and
// sending swaps it back for the pasted text, or for the image's saved path, which
// is what an agent can open. A marker is deleted as one piece.
const composerPastes = new Map();
const composerImages = new Map();
let pasteSeq = 0;
let imageSeq = 0;
const MARKER = /⟦(?:paste|image) #\d+ · [^⟧]*⟧/g;
const IMAGE_MAX = 10 * 1024 * 1024;

function pasteMarker(text, lines) {
  pasteSeq += 1;
  const size = text.length >= 1000 ? `${(text.length / 1000).toFixed(1)}k chars` : `${text.length} chars`;
  const token = `⟦paste #${pasteSeq} · ${lines} lines · ${size}⟧`;
  composerPastes.set(token, text);
  return token;
}

function imageMarker({ file, width, height, bytes, kind }) {
  imageSeq += 1;
  const size = bytes >= 1024 * 1024 ? `${(bytes / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(bytes / 1024))}KB`;
  const shape = width && height ? `${width}×${height} · ` : "";
  const token = `⟦image #${imageSeq} · ${shape}${kind} ${size}⟧`;
  composerImages.set(token, file);
  return token;
}

function expandDraft(text) {
  let out = text;
  for (const [token, value] of composerPastes) out = out.split(token).join(value);
  for (const [token, file] of composerImages) out = out.split(token).join(file);
  return out;
}

function fitDraft(box) {
  state.draft = box.value;
  box.style.height = "auto";
  box.style.height = Math.min(160, box.scrollHeight) + "px";
}

function putInDraft(box, text) {
  box.setRangeText(text, box.selectionStart, box.selectionEnd, "end");
  fitDraft(box);
}

async function attachImage(box, blob) {
  if (!String(blob.type).startsWith("image/")) return toast("only images can be attached", true);
  if (blob.size > IMAGE_MAX) return toast("an image can be at most 10MB", true);
  const res = await fetch("/api/attachments", { method: "POST", headers: { "content-type": blob.type }, body: blob });
  const found = await res.json().catch(() => ({}));
  if (!res.ok) return toast(found.error || `attach failed (${res.status})`, true);
  putInDraft(box, imageMarker(found));
}

const imagesIn = (list) => [...(list || [])].filter((f) => String(f.type).startsWith("image/"));

function restoreDraft() {
  const box = $("draft");
  if (!box) return;
  if (box.value !== (state.draft || "")) box.value = state.draft || "";
  box.style.height = "auto";
  box.style.height = Math.min(160, box.scrollHeight) + "px";
  box.oninput = () => fitDraft(box);
  // The TUI's rule: two lines and 200 characters go in as they are, anything
  // longer becomes a marker. An image on the clipboard is uploaded.
  box.onpaste = (event) => {
    const images = imagesIn(event.clipboardData?.files);
    if (images.length) {
      event.preventDefault();
      images.forEach((image) => attachImage(box, image));
      return;
    }
    const text = (event.clipboardData?.getData("text/plain") || "").replace(/\r\n?/g, "\n");
    const lines = text.split("\n").length;
    if (!text || (lines <= 2 && text.length <= 200)) return;
    event.preventDefault();
    putInDraft(box, pasteMarker(text, lines));
  };
  box.ondragover = (event) => {
    if ([...(event.dataTransfer?.items || [])].some((item) => item.kind === "file")) event.preventDefault();
  };
  box.ondrop = (event) => {
    const images = imagesIn(event.dataTransfer?.files);
    if (!images.length) return;
    event.preventDefault();
    images.forEach((image) => attachImage(box, image));
  };
  box.onbeforeinput = (event) => {
    if (event.isComposing || box.selectionStart !== box.selectionEnd) return;
    const back = event.inputType === "deleteContentBackward";
    if (!back && event.inputType !== "deleteContentForward") return;
    const at = box.selectionStart;
    for (const hit of box.value.matchAll(MARKER)) {
      const start = hit.index;
      const end = start + hit[0].length;
      if (back ? !(at > start && at <= end) : !(at >= start && at < end)) continue;
      event.preventDefault();
      box.setRangeText("", start, end, "end");
      composerPastes.delete(hit[0]);
      composerImages.delete(hit[0]);
      fitDraft(box);
      return;
    }
  };
  box.onkeydown = async (event) => {
    if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
    event.preventDefault();
    const text = expandDraft(box.value).trim();
    if (!text || state.sending) return;
    state.sending = true;
    try {
      await call("POST", "/api/inbox", { userRequest: text });
      state.draft = "";
      box.value = "";
      composerPastes.clear();
      composerImages.clear();
      state.data.inboxDetail = null;
      await load();
    } catch (err) {
      toast(err.message);
    } finally {
      state.sending = false;
    }
  };
}


/* ---------- views ---------- */
const views = {};

// Page furniture, in the handoff's classes: a head with a count and actions, a
// labelled rule over each block, and rows inside a bordered list.
const pageHead = (title, count, actions = "") =>
  `<div class="d-head"><h1 class="d-h2">${title}</h1>
    ${count ? `<span class="d-m" style="font-size:13px;color:var(--text-3)">${count}</span>` : ""}
    ${actions ? `<span style="margin-left:auto;display:flex;gap:8px">${actions}</span>` : ""}</div>`;
const rule = (label, right = "") =>
  `<div class="d-lblrule"><span class="d-lbl">${label}</span>
    ${right ? `<span class="d-m" style="margin-left:auto;font-size:11px;color:var(--text-3)">${right}</span>` : ""}</div>`;
const seg = (options, current, act) => `<span class="d-seg">${options.map(([value, label]) =>
  `<button class="d-segopt" aria-selected="${value === current}" data-act="${act}" data-value="${value}">${label}</button>`).join("")}</span>`;
const btn = (label, act, extra = "", kind = "") =>
  `<button class="gn-btn gn-btn-sm ${kind}" data-act="${act}" ${extra}>${label}</button>`;
const page = (inner) => `<div class="d-scroll d-pad">${inner}</div>`;


// Colours and shapes are the handoff's own (Pilo Desk.dc.html); only the data
// underneath is ours.
const OK = "var(--ok)", WARN = "var(--warn)", ERR = "var(--err)", DIM = "var(--line)", ACCT = "var(--accent-text)", INFO = "var(--info)";
const roleFg = (r) => r === "PILO" ? ACCT : r === "PM" ? INFO : "var(--text-2)";
const roleBg = (r) => r === "PILO" ? "var(--accent-weak)" : r === "PM" ? "var(--info-weak)" : "var(--bg-2)";
const runtimeMark = (rt) => rt === "claude"
  ? `<img class="d-rt" src="/marks/claude.png" alt="claude">`
  : rt === "codex"
    ? `<img class="d-rt d-rt-d" src="/marks/codex.png" alt="codex"><img class="d-rt d-rt-l" src="/marks/codex-light.png" alt="codex">`
    : "";

// The tree is the same shape the TUI draws: the desk, then each PM, then the
// workers under it.
function treeRows() {
  const tree = state.data.tree;
  if (!tree?.pilo) return [];
  const rows = [];
  const push = (a, lvl) => rows.push({ a, lvl });
  push(tree.pilo, 0);
  (tree.pilo.children || []).forEach((w) => push(w, 1));
  (tree.pms || []).forEach((pm) => {
    push(pm, 1);
    (pm.children || []).forEach((w) => push(w, 2));
  });
  (tree.orphanWorkers || []).forEach((w) => push(w, 1));
  return rows;
}

// One word, from the list text.js already keeps: idle · running · stalled ·
// blocked · failed · unbound · no answer · limited. The same ladder the TUI
// walks, so the two screens cannot disagree. What an agent is actually saying
// belongs in the conversation, not in a column that has to cut it off.
const STALL_MS = 10 * 60 * 1000;

function stalled(a) {
  if (a.status !== "running" || !a.lastSignal) return false;
  if (a.sessionStatus === "working") return false;
  return Date.now() - new Date(a.lastSignal).getTime() > STALL_MS;
}

// The word and the colour come out of the same ladder, so a dot and the word
// beside it can never say different things about the same agent.
function agentTone(a) {
  if (a.limitedUntil && new Date(a.limitedUntil).getTime() > Date.now()) return WARN;
  if (a.gaveUp > 0 && a.status !== "running") return ERR;
  if (a.status === "running" && stalled(a)) return WARN;
  if (a.status === "blocked") return INFO;
  if (a.status === "failed" || a.status === "unbound") return ERR;
  if (a.status === "running" || a.sessionStatus === "working") return WARN;
  return OK;
}

// The sidebar tree marks a working agent the way the TUI does: a braille spinner,
// ⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏, a frame every 120 ms (the TUI's own tick), 1.2 s round. Only a
// running agent that has not gone quiet spins; a stalled one shows the TUI's
// still ◌, and every other state keeps its dot. The frames are a CSS keyframe
// on ::before, so what is painted never changes and nothing is redrawn for it.
function agentMark(a, colour) {
  if (a.status === "running" && !stalled(a)) return `<span class="d-spin" style="color:${colour}" aria-label="working"></span>`;
  if (a.status === "running") return `<span class="d-spin-still" style="color:${colour}" aria-label="stalled">◌</span>`;
  return `<span class="d-dot" style="background:${colour}"></span>`;
}

function agentNote(a) {
  if (a.limitedUntil && new Date(a.limitedUntil).getTime() > Date.now()) return T("state.limited");
  if (a.gaveUp > 0 && a.status !== "running") return T("state.gaveUp");
  if (a.status === "running" && stalled(a)) return T("state.stalled");
  if (a.status === "blocked") return T("state.blocked");
  if (a.status === "failed") return T("state.failed");
  if (a.status === "unbound") return T("state.unbound");
  if (a.status === "running" || a.sessionStatus === "working") return T("state.running");
  return T("state.idle");
}

function renderWorkPanes() {
  const st = state.data.overview?.stats || {};
  const rows = treeRows();
  const running = (state.data.tree?.pms || []).filter((p) => p.status === "running").length;
  const lost = rows.filter((r) => r.a.status === "unbound").length;
  const strip = [
    ["requests today", String(st.inboxToday?.total ?? 0), `${st.inboxToday?.replied ?? 0} answered`, "var(--text)"],
    ["in flight", String(running), running ? "working" : "nothing on", running ? WARN : "var(--text)"],
    ["tokens", fmtTokens(st.tokens?.total ?? 0), "today", "var(--text)"],
    ["needs you", String(lost || st.failed?.total || 0), lost ? "session lost" : st.failed?.total ? "failed" : "nothing", (lost || st.failed?.total) ? ERR : "var(--text)"]
  ];
  const stripHtml = strip.map(([k, v, sub, color]) => `<div>
    <div class="d-lbl">${k}</div>
    <div class="d-m" style="font-size:24px;margin-top:6px;color:${color}">${v}<span style="font-size:13px;color:var(--text-3)"> · ${sub}</span></div>
  </div>`).join("");

  const treeHtml = `<div style="padding:16px 14px 10px;display:flex;align-items:center">
      <span class="d-lbl">${T("desk.rail.agents")}</span>
      <span class="d-m" style="margin-left:auto;font-size:11px;color:var(--text-3)">${st.pilo ?? 0} pilo · ${st.pm ?? 0} pm · ${st.worker ?? 0} worker</span>
    </div>
    <div class="d-scroll">${rows.map(({ a, lvl }) => {
      const role = a.role.toUpperCase();
      const colour = agentTone(a);
      const padL = 12 + lvl * 18;
      const picked = state.feed.agent === a.name;
      return `<button class="d-plain" style="display:block;width:100%;border-left:2px solid ${picked ? "var(--accent)" : "transparent"};background:${picked ? "var(--bg-2)" : "transparent"};cursor:pointer" data-act="pick-agent" data-name="${esc(a.name)}">
        <span style="display:flex;align-items:center;gap:9px;padding:6px 12px 2px ${padL}px">
          ${lvl ? `<span class="d-m" style="color:var(--text-3);font-size:12px;flex:none">└</span>` : ""}
          ${agentMark(a, colour)}
          ${runtimeMark(a.runtime)}
          <span class="d-clip" style="font-size:14px;flex:1">${esc(a.name)}</span>
          <span class="d-chip" style="color:${roleFg(role)};background:${roleBg(role)}">${role}</span>
        </span>
        <span style="display:block;padding:0 12px 6px ${padL + 17}px">
          <span class="d-m d-clip" style="display:block;font-size:11px;color:${colour}">${esc(agentNote(a))}</span>
        </span>
      </button>`;
    }).join("")}</div>
    <div class="d-treefoot"><button class="gn-btn gn-btn-brand gn-btn-block" data-act="go-agents">${T("desk.act.addAgent")}</button></div>`;

  return paint("strip", stripHtml) | paint("tree", treeHtml);
}

// One request reads as a conversation: what you asked, what the desk said, what
// each agent is doing, and the answer.
const hhmm = (iso) => {
  const d = iso ? new Date(iso) : null;
  return d && !Number.isNaN(d.getTime())
    ? `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` : "";
};

// One conversation's lines, in the order they happened: what you asked, what
// each agent said while working, its result, and the answer.
function feedMessages(item, detail) {
  const full = detail || item;
  const state_ = convState(item, detail);
  const msgs = [{ who: `you · ${hhmm(item.createdAt)}`, kind: "you", text: item.userRequest || "" }];
  for (const task of full.tasks || []) {
    const agent = task.agent || "agent";
    // A note is news only while its task is still open. What the task finally
    // reported is not shown here at all: Work is the conversation — the
    // question, what is happening, and the answer — and each PM's and worker's
    // result is on the Requests screen beside the rest of the trace.
    if (!state_.answered && task.progress && !["done", "failed", "canceled"].includes(task.status)) {
      msgs.push({ who: `${agent} · working${task.progressAt ? ` · ${hhmm(task.progressAt)}` : ""}`, kind: "working", text: task.progress });
    }
  }
  if (!detail && item.progress && !state_.answered) {
    msgs.push({ who: `${item.progressBy || "agent"} · working`, kind: "working", text: item.progress });
  }
  for (const reply of full.replies || []) {
    msgs.push({ who: `${reply.agent || "pilo"} · ${hhmm(reply.createdAt)} · answer`, kind: "answer", text: reply.body || "" });
  }
  // The list row can carry the answer before a detail fetched earlier does.
  if (!(detail?.replies || []).length && item.finalReply) {
    msgs.push({ who: `pilo · ${hhmm(item.repliedAt)} · answer`, kind: "answer", text: item.finalReply });
  }

  // Until the answer lands the conversation says what it is waiting for, in the
  // TUI's own words. Agents rarely leave a progress note, and without this the
  // dashboard showed the question and then nothing at all — which is what the
  // TUI's card was for. The ladder is the TUI's: writing the reply beats a
  // note, and a note beats the general word for waiting.
  if (!state_.answered) {
    if (state_.needsReply) {
      msgs.push({
        who: `${item.routed || "pilo"} · ${T("card.needsReply")}`,
        kind: "attention",
        text: Number(item.taskCount || 0) > 1
          ? T("card.needsReplyMany", { count: item.taskCount })
          : T("card.needsReplyOne")
      });
    } else if (!msgs.some((m) => m.kind === "working")) {
      msgs.push({
        who: item.routed || "pilo",
        kind: "waiting",
        text: item.routed ? T("card.waiting") : T("card.queued")
      });
    }
  }
  return msgs;
}

// The handoff caps these at 620px for your own lines and 680px for an agent's,
// which reads well beside a narrow column of prose. Here the conversation is
// the whole screen, and the reader asked for the width back: the cap is gone
// and only .d-pad's 28px keeps the text off the edge.
function bubble(m) {
  if (m.kind === "you") return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
    <span class="d-lbl">${esc(m.who)}</span>
    <div style="border:var(--bw) solid var(--line);background:var(--bg-2);padding:12px 16px;width:100%">
      <div class="md" style="font-size:var(--fs-body);line-height:1.62">${prose(m.text)}</div></div></div>`;
  // The bar carries the state, out of the same colours the rest of the screen
  // uses: amber while something is still moving, red when it is waiting on you,
  // accent for the answer, and the plain rule for a result that is only history.
  const bar = { answer: "var(--accent)", working: WARN, waiting: WARN, attention: ERR }[m.kind] || "var(--line)";
  const fg = m.kind === "answer" ? "var(--text)" : "var(--text-2)";
  // Only a line about work that is moving pulses. The TUI holds the red one
  // still on purpose — it is waiting on you, and nothing is happening — and a
  // finished line has nothing to claim.
  const live = m.kind === "working" || m.kind === "waiting";
  return `<div style="display:flex;flex-direction:column;gap:6px">
    <span class="d-lbl">${esc(m.who)}</span>
    <div style="display:flex;width:100%">
      <span class="d-bar${live ? " d-bar-live" : ""}" style="background:${bar}"></span>
      <div class="md" style="flex:1;min-width:0;padding:8px 0 8px 14px;font-size:var(--fs-body);line-height:1.62;color:${fg}">${prose(m.text)}</div>
    </div></div>`;
}

// Who took it. The desk agent answers some requests itself, and those carry no
// agent name — the TUI calls that PILO, so this does too.
const routedNames = (item) => String(item.routed || "").split(", ").filter(Boolean);

function routedChips(item) {
  const names = routedNames(item);
  if (!names.length) return `<span class="d-chip" style="color:${ACCT};background:var(--accent-weak);flex:none">PILO</span>`;
  const shown = names.slice(0, 3);
  return shown.map((name) => `<span class="d-chip" style="color:var(--text-2);background:var(--bg-2);flex:none">${esc(name)}</span>`).join("")
    + (names.length > shown.length ? `<span class="d-m" style="font-size:11px;color:var(--text-3);flex:none">+${names.length - shown.length}</span>` : "");
}

// One reading of a conversation, used by its head and by its body alike. The
// head used to read the list row and the body the detail fetched when it was
// opened; when an answer landed the row moved on and the detail did not, so
// the mark turned green over a bar that was still amber.
function convState(item, detail) {
  const replies = detail?.replies || [];
  const answered = replies.length > 0 || Boolean(item.finalReply) || detail?.status === "replied";
  const failed = item.status === "failed" || detail?.status === "failed";
  return { answered, failed, needsReply: !answered && Boolean(item.needsReply) };
}

const convMood = (item, detail) => {
  const s = convState(item, detail);
  return s.answered ? OK : s.needsReply || s.failed ? ERR : WARN;
};

// The folded row. The TUI clips the question to two lines and shows the state
// mark and who took it; the time is added here because a page of ten covers
// more than one day and the reader asked to see when.
function convHead(item, isFolded) {
  const line = String(item.userRequest || "").split("\n").map((x) => x.trim()).filter(Boolean).join(" · ");
  return `<button class="d-plain" style="display:flex;align-items:baseline;gap:10px;width:100%;padding:6px 0;cursor:pointer" data-act="toggle-conv" data-id="${item.id}">
    <span class="d-m" style="color:${convMood(item, state.feed.detail[item.id])};flex:none">${isFolded ? "›" : "⌄"}</span>
    <span class="d-m" style="font-size:11px;color:var(--text-3);flex:none">${hhmm(item.createdAt)}</span>
    ${routedChips(item)}
    <span class="d-clip" style="font-size:var(--fs-body);color:var(--text-2);text-align:left;min-width:0;flex:1">${isFolded ? esc(line) : ""}</span>
    <span class="d-m" style="font-size:11px;color:var(--text-3);flex:none">in-${item.id}</span>
  </button>`;
}

function convBlock(item, fromNewest) {
  const shut = folded(item.id, fromNewest);
  const head = convHead(item, shut);
  if (shut) return `<div style="display:flex;flex-direction:column">${head}</div>`;
  const detail = state.feed.detail[item.id];
  const msgs = feedMessages(item, detail);
  return `<div style="display:flex;flex-direction:column;gap:22px;padding-bottom:8px">
    ${head}${msgs.map(bubble).join("")}</div>`;
}

function workFeed() {
  const f = state.feed;
  if (!f.rows.length) return `<div class="d-lbl" style="padding:8px 0">nothing yet — type below</div>`;
  const top = f.done
    ? `<div class="d-lbl" style="padding:8px 0;text-align:center">that is the whole of it — ${f.rows.length} shown</div>`
    : `<div class="d-lbl" style="padding:8px 0;text-align:center">${f.loading ? "loading older…" : "scroll up for older"}</div>`;
  const banner = f.agent
    ? `<div style="display:flex;align-items:center;gap:10px;padding:8px 0">
        <span class="d-lbl">only ${esc(f.agent)}</span>
        ${btn("Every agent", "clear-feed-filter", "", "gn-btn-ghost")}</div>`
    : "";
  // Newest at the bottom, the way the TUI stacks them.
  const blocks = f.rows.map((item, i) => convBlock(item, i)).reverse().join("");
  return banner + top + blocks;
}

// A number that grows whenever there is something new to read, so the feed
// knows whether to follow.
function feedSize() {
  return state.feed.rows.reduce((n, item, i) =>
    n + 1 + (folded(item.id, i) ? 0 : feedMessages(item, state.feed.detail[item.id]).length), 0);
}

views.work = () => `<div class="d-scroll d-pad" style="display:flex;flex-direction:column;gap:22px">${workFeed()}</div>
  <div class="d-composer"><div class="d-cin">
    <span class="d-m" style="color:var(--accent-text);font-size:15px;line-height:1.62">❯</span>
    <textarea class="d-ta" id="draft" rows="1" placeholder="${T("desk.composer")}"></textarea>
    <span class="d-m" style="font-size:11px;letter-spacing:0.14em;color:var(--text-3);align-self:center">${T("desk.composer.hint")}</span>
  </div></div>`;

views.overview = () => {
  const { stats, tasks, services, paths, wakeFailures } = state.data.overview;
  const cards = [
    ["agents", stats.agents, `${stats.pilo} pilo · ${stats.pm} pm · ${stats.worker} worker`],
    ["inbox today", stats.inboxToday.total, `${stats.inboxToday.replied} replied · ${stats.inboxToday.pending} 대기`],
    ["tokens", fmtTokens(stats.tokens.total), `in ${fmtTokens(stats.tokens.in)} · out ${fmtTokens(stats.tokens.out)} · today`],
    [
      "현재 문제",
      stats.failed.total,
      stats.failed.total
        ? `wake ${stats.failed.wake} · task ${stats.failed.task}`
        : `누적 ${(stats.history?.failedTasks ?? 0) + (stats.history?.wakeFailures ?? 0)}건은 Events에`
    ]
  ];
  return `
    <div class="grid4">${cards.map(([l, v, s]) => `<div class="card"><div class="label">${l}</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-top:10px"><span class="value">${esc(v)}</span><span class="sub">${esc(s)}</span></div></div>`).join("")}</div>
    <div class="grid2">
      <div class="table">
        <div class="title">Recent tasks <span class="mono" style="margin-left:auto;font-size:11px;color:#5f6b64">last ${tasks.length}</span></div>
        <div class="row head" style="grid-template-columns:74px 1fr 140px 84px 74px"><span>time</span><span>task</span><span>agent</span><span>status</span><span>tokens</span></div>
        ${tasks.length ? tasks.map((t) => `<div class="row" style="grid-template-columns:74px 1fr 140px 84px 74px">
          <span class="mono" style="font-size:11px;color:#5f6b64">${time(t.createdAt)}</span>
          <span style="color:var(--text);padding-right:16px;overflow:hidden;min-width:0">
            <span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title || t.request || "(untitled)")}</span>
            ${t.progress && !["done", "failed"].includes(t.status) ? `<span style="display:block;margin-top:3px;font:11px var(--mono);color:var(--amber);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">진행 · ${esc(t.progress)}</span>` : ""}
          </span>
          <span class="mono" style="font-size:11px">${esc(t.agent || "—")}</span>
          <span class="mono" style="font-size:11px;color:${stateColor(t.status)}">${esc(t.status)}</span>
          <span class="mono" style="font-size:11px">${fmtTokens(Number(t.tokensIn) + Number(t.tokensOut))}</span>
        </div>`).join("") : `<div class="empty">no tasks yet</div>`}
      </div>
      <div>
        ${blockedCard(state.data.overview.blocked || [])}
        ${serviceCard(services)}
        ${failureCard(wakeFailures)}
      </div>
    </div>
    <div class="card"><h2>설정 경로</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;font:11px var(--mono)">
        ${paths.map((p) => `<div style="display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid #171b19">
          <span style="color:#5f6b64;width:52px;flex:none">${esc(p.label)}</span>
          <span style="color:#b9c3bc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.value)}</span></div>`).join("")}
      </div></div>`;
};

const fmtTokens = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n || 0));

function blockedCard(rows) {
  if (!rows.length) return "";
  return `<div class="card" style="margin-bottom:12px;border-color:#232b31">
    <h2>결정 대기 ${rows.length}건</h2>
    <p class="hint">답을 주면 그 작업이 다시 큐로 들어가고 agent가 이어서 진행합니다.</p>
    ${rows.map((r) => `<div style="padding:12px 0;border-top:1px solid #171b19">
      <div class="mono" style="font-size:11px;color:var(--blue)">#${r.id} ${esc(r.agent)}${r.project ? ` · ${esc(r.project)}` : ""}</div>
      <div style="margin:6px 0 8px;font-size:12.5px;line-height:1.6;color:var(--text)">${esc(r.question || "확인 필요")}</div>
      <div style="display:flex;gap:6px">

        <button class="btn small" data-act="answer" data-id="${r.id}">보내기</button>
      </div>
    </div>`).join("")}
  </div>`;
}

      <div style="margin-top:7px;font:11px/1.6 var(--mono);color:#8b968e">${esc(f.payload.hint || "")}${f.totalFailures > 1 ? ` · 누적 ${f.totalFailures}회` : ""}</div>

        <button class="btn small" data-act="open-event" data-id="${f.id}">open log</button>
