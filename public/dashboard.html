<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilo dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pilo">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0d0c'/><text x='16' y='23' font-family='monospace' font-size='20' font-weight='600' fill='%23eef2ee' text-anchor='middle'>P</text></svg>">
<style>
  @font-face { font-family: "IBM Plex Sans"; src: url("./fonts/IBMPlexSans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap }
  @font-face { font-family: "IBM Plex Sans"; src: url("./fonts/IBMPlexSans-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap }
  @font-face { font-family: "IBM Plex Sans"; src: url("./fonts/IBMPlexSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap }
  @font-face { font-family: "IBM Plex Mono"; src: url("./fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap }
  @font-face { font-family: "IBM Plex Mono"; src: url("./fonts/IBMPlexMono-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap }
  @font-face { font-family: "IBM Plex Mono"; src: url("./fonts/IBMPlexMono-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap }

  :root {
    color-scheme: dark;
    --bg: #08090a; --panel: #0c0f0e; --panel2: #0a0c0b; --line: #1a1e1c; --line2: #26302b;
    --text: #d9ded9; --strong: #eef2ee; --muted: #7d887f; --faint: #4f5a53;
    --green: #3ed49c; --amber: oklch(0.83 0.12 80); --red: oklch(0.70 0.15 25); --blue: oklch(0.78 0.08 235);
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", ui-sans-serif, -apple-system, "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased }
  button, input, select, textarea { font: inherit; color: inherit }
  .mono { font-family: var(--mono) }
  html, body { height: 100%; overflow: hidden }
  .topbar { flex: none; z-index: 20; display: flex; align-items: center; gap: 28px; padding: 14px 28px;
    background: rgba(8, 9, 10, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line) }
  .topbar .mark { font: 600 17px var(--mono); letter-spacing: -.03em; color: var(--strong) }
  .topbar .tag { font: 11px var(--mono); color: #5f6b64 }
  .topbar .state { margin-left: auto; display: flex; align-items: center; gap: 14px; font: 11px var(--mono); color: var(--muted) }
  body { display: flex; flex-direction: column }
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px 1fr }

  aside { border-right: 1px solid var(--line); background: var(--panel2); padding: 22px 12px;
    display: flex; flex-direction: column; overflow: hidden }
  .eyebrow { font: 10px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; padding: 0 10px 12px }
  .tab { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; margin-bottom: 2px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: #6f7a73; font-size: 13px; text-align: left; cursor: pointer }
  .tab:hover { background: #121615; color: var(--text) }
  .tab.active { background: #121615; border-color: #232b28; color: var(--text) }
  .tab .num { font: 11px var(--mono); color: var(--faint); width: 16px }
  .badge { margin-left: auto; font: 10px var(--mono); padding: 2px 7px; border-radius: 999px; background: #151a18 }
  .side-card { margin-top: auto; padding: 14px 12px; border: 1px solid var(--line); border-radius: 9px; background: #0d100f; font: 11px var(--mono); color: #9aa59d }
  .side-card .sub { margin-top: 7px; font-size: 10px; line-height: 1.7; color: var(--faint) }

  main { padding: 30px 32px 60px; overflow-y: auto; overflow-x: hidden; min-height: 0 }
  header { position: sticky; top: -30px; z-index: 10; display: flex; align-items: flex-end; gap: 16px;
    margin: -30px -32px 24px; padding: 30px 32px 14px; background: var(--bg) }
  h1 { margin: 0 0 5px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; color: var(--strong) }
  header p { margin: 0; font-size: 13px; color: var(--muted) }
  .pill { font: 11px var(--mono); padding: 7px 12px; border-radius: 7px; border: 1px solid #1e2422; color: var(--muted); white-space: nowrap }

  .card { padding: 18px 20px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel) }
  .card h2 { margin: 0 0 4px; font-size: 13px; font-weight: 500; color: var(--text) }
  .card p.hint { margin: 0 0 14px; font-size: 12px; line-height: 1.6; color: var(--muted) }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px }
  .grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; margin-bottom: 12px }
  .split { display: grid; grid-template-columns: 1fr 400px; gap: 14px }
  .half { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
  .label { font: 10px var(--mono); letter-spacing: .1em; color: #5f6b64; text-transform: uppercase }
  .value { font: 500 24px var(--mono); color: var(--strong) }
  .sub { font-size: 11px; color: #67726b }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none }
  .row { display: grid; align-items: center; padding: 11px 16px; border-bottom: 1px solid #121615; font-size: 12px; color: #9aa59d }
  .row:hover { background: #101413 }
  .head { font: 10px var(--mono); letter-spacing: .1em; color: var(--faint); text-transform: uppercase; border-bottom: 1px solid #171b19; padding: 9px 16px }
  .table { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--panel) }
  .table .title { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid #171b19; font-size: 13px; color: var(--text); font-weight: 500 }
  .inbox { display: grid; grid-template-columns: 340px 1fr; gap: 14px; height: calc(100vh - 190px); min-height: 340px }
  .inbox > * { overflow-y: auto; min-height: 0 }
  .inbox .table { display: flex; flex-direction: column }
  .inbox .table .title { position: sticky; top: 0; background: var(--panel); z-index: 1 }
  .daygroup { padding: 8px 16px; font: 10px var(--mono); letter-spacing: .1em; color: var(--faint);
    text-transform: uppercase; background: var(--panel2); border-bottom: 1px solid #121615; position: sticky; top: 43px }
  .step { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid #171b19 }
  .step .body { font-size: 12.5px; line-height: 1.65; color: #b9c3bc; white-space: pre-wrap }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line) }
  .chip { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: transparent;
    color: var(--faint); font: 10px var(--mono); cursor: pointer }
  .chip:hover { color: var(--text) }
  .chip.on { border-color: #2f5f4c; color: var(--green) }
  .step .body.short { max-height: 3.4em; overflow: hidden; mask-image: linear-gradient(#000 50%, transparent) }
  .empty { padding: 34px 16px; color: var(--faint); font: 12px var(--mono); text-align: center }

  .btn { font: 11px var(--mono); padding: 6px 11px; border-radius: 6px; border: 1px solid var(--line2); background: #131817; color: #9aa59d; cursor: pointer; white-space: nowrap }
  .btn:hover { color: var(--strong); border-color: #3a4540 }
  .btn.small { font-size: 10px; padding: 4px 8px; background: var(--panel2) }
  .btn.danger:hover { color: var(--red); border-color: #3a2a28 }
  .btn.primary { width: 100%; padding: 10px; font-size: 12px; border-color: #2b3531; background: #151a18; color: var(--strong) }
  .btn[disabled] { opacity: .45; cursor: not-allowed }
  .btn.wide { width: 100% }

  .field { margin-bottom: 13px }
  .field .name { display: flex; align-items: baseline; gap: 7px; margin-bottom: 6px; font: 11px var(--mono); color: #9aa59d }
  .field .name .hint { font-size: 10px; color: var(--faint) }
  .field .name .req { margin-left: auto; font-size: 10px; color: var(--red) }
  .field input, .field select, .field textarea { width: 100%; font: 12px var(--mono); padding: 9px 11px; border-radius: 7px; border: 1px solid #1e2422; background: var(--panel2); color: #e6ebe6; outline: none }
  .field input:focus, .field select:focus { border-color: #3a4540 }
  .choices { display: flex; gap: 6px }
  .choice { position: relative; flex: 1; font: 11px var(--mono); padding: 8px 6px; border-radius: 7px; border: 1px solid #1e2422; background: var(--panel2); color: #6f7a73; cursor: pointer }
  .choice.on { border-color: #3a4540; background: #151a18; color: var(--strong) }
  .choice small { display: block; margin-top: 3px; font-size: 9px; color: var(--faint) }

  .node { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-radius: 10px; border: 1px solid #1e2422; background: #0d100f }
  .node.root { display: inline-flex; border-color: #24312c; background: linear-gradient(180deg, #101413, #0b0e0d) }
  .node .name { font: 13px var(--mono); color: var(--strong) }
  .node .meta { font: 11px var(--mono); color: #5f6b64 }
  .node .acts { margin-left: auto; display: flex; gap: 6px }
  .role { font: 9px var(--mono); letter-spacing: .08em; padding: 3px 7px; border-radius: 3px; border: 1px solid #232b28 }
  .role.pilo { color: var(--green); border-color: #24312c }
  .role.pm { color: var(--blue); border-color: #232b31 }
  .role.worker { color: var(--muted); border-color: #1e2422 }
  .branch { margin: 4px 0 0 26px; border-left: 1px solid #1e2422; padding-left: 22px }
  .branch .node::before { content: ""; position: absolute; left: -22px; top: 50%; width: 22px; height: 1px; background: #1e2422 }

  .list-item { position: relative; display: block; width: 100%; text-align: left; padding: 13px 15px; border: none; border-bottom: 1px solid #121615; background: transparent; cursor: pointer; color: inherit }
  .list-item:hover { background: #101413 }
  .list-item.on { background: #121615; box-shadow: inset 2px 0 0 var(--green) }
  .code { padding: 16px; overflow: auto; max-height: 320px; font: 12px/1.85 var(--mono) }
  .code .ln { display: flex; gap: 16px }
  .code .n { color: #2f3634; width: 24px; text-align: right; flex: none }
  .code .t { white-space: pre }
  .toggle { width: 30px; height: 17px; border-radius: 999px; border: none; padding: 0; position: relative; cursor: pointer }
  .toggle span { position: absolute; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--panel2) }
  .note { margin-top: 14px; padding: 11px 13px; border-radius: 8px; border: 1px dashed #232927; font: 10px/1.8 var(--mono); color: #5f6b64 }
  .fail { padding: 18px; border: 1px solid oklch(0.40 0.10 25 / .35); border-radius: 11px; background: oklch(0.26 0.05 25 / .14) }
  .fail .item { margin-top: 12px; padding: 12px; border-radius: 9px; background: #0b0d0c; border: 1px solid #1e2422 }
  table.md { border-collapse: collapse; margin: 8px 0; font: 11px var(--mono); width: 100%; display: block; overflow-x: auto }
  table.md th, table.md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; white-space: nowrap }
  table.md th { background: var(--panel2); color: var(--text); font-weight: 500 }
  table.md td { color: #b9c3bc }
  .toast { position: fixed; right: 20px; bottom: 20px; padding: 11px 15px; border-radius: 9px; border: 1px solid var(--line2); background: #101413; font: 12px var(--mono); color: var(--text); opacity: 0; transition: opacity .18s; pointer-events: none }
  .toast.show { opacity: 1 }
  .toast.bad { border-color: #3a2a28; color: #f0c2b8 }
  a { color: var(--green); text-decoration: none }
  @media (max-width: 1100px) { .split, .half, .grid2 { grid-template-columns: 1fr } .grid4 { grid-template-columns: repeat(2, 1fr) } }
  @media (max-width: 780px) { .app { grid-template-columns: 1fr } aside { display: none } main { padding: 20px } }
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <span class="mark">Pilo</span>
    <span class="tag">local agent desk</span>
  </div>
  <div class="state" id="topstate"></div>
</div>
<div class="app">
  <aside>
    <div class="eyebrow">dashboard</div>
    <nav id="tabs" style="flex:none"></nav>
    <div class="side-card" id="sideCard"></div>
  </aside>
  <main>
    <header>
      <div>
        <h1 id="tabTitle">Overview</h1>
        <p id="tabDesc"></p>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <span class="pill" id="sync">loading…</span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { tablesToHtml } from "/markdown.js";
import { TUI_COMMANDS, CLI_COMMANDS } from "/commands.js";
import { t } from "/text.js";
const TABS = [
  "overview", "agents", "inbox", "events", "artifacts", "projects", "commands", "settings", "system"
].map((key) => [key, t(`dash.tab.${key}`), t(`dash.tab.${key}.desc`)]);

const state = {
  tab: location.hash.slice(1) || "overview",
  data: {},
  form: emptyForm(),
  editing: null,
  candidates: [],
  rules: null,
  openTrace: null,
  selected: { event: null, artifact: null, inbox: null },
  inboxFilter: null,
  project: { id: null, name: "", repo: "", path: "", note: "" }
};

function emptyForm() {
  return { name: "", role: "pm", parentAgentId: "", projectId: "", projectName: "", cwd: "", specialty: "", aliases: "", note: "", model: "", runtime: "", writeRules: true };
}

const $ = (id) => document.getElementById(id);
// Agent prose often carries markdown tables; show them as tables.
const prose = (text) => tablesToHtml(text, esc) ?? esc(text);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const time = (v) => (v ? new Date(v).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "—");
const stamp = (v) => (v ? new Date(v).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—");
const stateColor = (s) => ({ failed: "var(--red)", down: "var(--red)", running: "var(--amber)", degraded: "var(--amber)", blocked: "var(--blue)", queued: "var(--faint)", archived: "var(--faint)", unbound: "var(--faint)" }[s] || "var(--green)");

let toastTimer;
function toast(message, bad = false) {
  const el = $("toast");
  el.textContent = message;
  el.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = "toast"), 2600);
}

async function call(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(payload.error || `${method} ${path} failed`);
  return payload;
}
const get = (path) => call("GET", path);

async function load() {
  const [overview, tree, projects, inbox, events, artifacts, settings, system, setup, sessions, agents] = await Promise.all([
    get("/api/overview"), get("/api/agents/tree"), get("/api/projects"), get("/api/inbox"),
    get("/api/events"), get("/api/artifacts"), get("/api/settings"), get("/api/system"), get("/api/setup"),
    get("/api/sessions"), get("/api/agents")
  ]);
  state.data = { ...state.data, overview, tree, projects, inbox, events, artifacts, settings, system, setup, sessions, agents };
  await loadDetail();
  $("sync").textContent = "updated " + new Date().toLocaleTimeString("ko-KR");
  render();
}

// The detail panes keep their own selection, so refresh them alongside the lists.
async function loadDetail() {
  const pick = (list, chosen) => (list.some((x) => String(x.id) === String(chosen)) ? chosen : list[0]?.id);
  if (state.tab === "inbox") {
    const id = pick(state.data.inbox, state.selected.inbox);
    state.selected.inbox = id ?? null;
    state.data.inboxDetail = id ? await get(`/api/inbox/${id}`) : null;
  }
  if (state.tab === "events") {
    const id = pick(state.data.events, state.selected.event);
    state.selected.event = id ?? null;
    state.data.eventDetail = id ? await get(`/api/events/${id}`) : null;
  }
  if (state.tab === "artifacts") {
    const id = pick(state.data.artifacts, state.selected.artifact);
    state.selected.artifact = id ?? null;
    state.data.artifactDetail = id ? await get(`/api/artifacts/${id}`) : null;
  }
}

function renderTabs() {
  const badges = {
    inbox: state.data.inbox?.filter((i) => i.status !== "replied").length || 0,
    system: state.data.system?.wakeFailures?.length || 0 // already filtered to unresolved
  };
  $("tabs").innerHTML = TABS.map(([key, label]) => {
    const badge = badges[key];
    return `<button class="tab ${state.tab === key ? "active" : ""}" data-tab="${key}">
      <span>${label}</span>
      ${badge ? `<span class="badge" style="color:${key === "system" ? "var(--red)" : "var(--amber)"}">${badge}</span>` : ""}
    </button>`;
  }).join("");
  const s = state.data.setup || {};
  const st = state.data.overview?.stats || {};
  const server = state.data.system?.services?.find((x) => x.name === "server");
  $("topstate").innerHTML = `
    <span><span class="dot" style="background:${stateColor(server?.state)};margin-right:6px"></span>${esc(server?.state || "unknown")}</span>
    <span style="color:var(--faint)">agents ${st.agents ?? 0}</span>
    <span style="color:var(--faint)">inbox ${st.inboxToday?.pending ?? 0} 대기</span>
    <span style="color:${st.failed?.total ? "var(--red)" : "var(--faint)"}">failed ${st.failed?.total ?? 0}</span>`;
  $("sideCard").innerHTML = `
    <div style="display:flex;align-items:center;gap:7px">
      <span class="dot" style="background:${s.herdr ? "var(--green)" : "var(--red)"}"></span>
      herdr ${s.herdr ? "connected" : "not detected"}
    </div>
    <div class="sub">${s.sessions || 0} sessions<br>${st.pilo || 0} pilo · ${st.pm || 0} pm · ${st.worker || 0} worker</div>`;
}

// Every refresh rebuilds #view, and a rebuilt element starts at scrollTop 0, so
// the inbox panes and code blocks jumped back to the top every 5 seconds.
// Remember where each scroller was and put it back. On a tab change the old
// positions belong to a different view, so they are not carried over.
const SCROLLERS = "main, .inbox > *, #view .code, #view .table";

function scrollState() {
  return [...document.querySelectorAll(SCROLLERS)].map((n) => n.scrollTop);
}

function restoreScroll(tops) {
  [...document.querySelectorAll(SCROLLERS)].forEach((n, i) => {
    if (tops[i]) n.scrollTop = tops[i];
  });
}

let renderedTab = null;

function render() {
  const meta = TABS.find((t) => t[0] === state.tab) || TABS[0];
  const tops = renderedTab === state.tab ? scrollState() : [];
  $("tabTitle").textContent = meta[1];
  $("tabDesc").textContent = meta[2];
  renderTabs();
  $("view").innerHTML = views[state.tab]();
  wire();
  renderedTab = state.tab;
  if (tops.length) restoreScroll(tops);
}

/* ---------- views ---------- */
const views = {};

views.overview = () => {
  const { stats, tasks, services, paths, wakeFailures } = state.data.overview;
  const cards = [
    ["agents", stats.agents, `${stats.pilo} pilo · ${stats.pm} pm · ${stats.worker} worker`],
    ["inbox today", stats.inboxToday.total, `${stats.inboxToday.replied} replied · ${stats.inboxToday.pending} 대기`],
    ["tokens", fmtTokens(stats.tokens.total), `in ${fmtTokens(stats.tokens.in)} · out ${fmtTokens(stats.tokens.out)} · today`],
    [
      "현재 문제",
      stats.failed.total,
      stats.failed.total
        ? `wake ${stats.failed.wake} · task ${stats.failed.task}`
        : `누적 ${(stats.history?.failedTasks ?? 0) + (stats.history?.wakeFailures ?? 0)}건은 Events에`
    ]
  ];
  return `
    <div class="grid4">${cards.map(([l, v, s]) => `<div class="card"><div class="label">${l}</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-top:10px"><span class="value">${esc(v)}</span><span class="sub">${esc(s)}</span></div></div>`).join("")}</div>
    <div class="grid2">
      <div class="table">
        <div class="title">Recent tasks <span class="mono" style="margin-left:auto;font-size:11px;color:#5f6b64">last ${tasks.length}</span></div>
        <div class="row head" style="grid-template-columns:74px 1fr 140px 84px 74px"><span>time</span><span>task</span><span>agent</span><span>status</span><span>tokens</span></div>
        ${tasks.length ? tasks.map((t) => `<div class="row" style="grid-template-columns:74px 1fr 140px 84px 74px">
          <span class="mono" style="font-size:11px;color:#5f6b64">${time(t.createdAt)}</span>
          <span style="color:var(--text);padding-right:16px;overflow:hidden;min-width:0">
            <span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title || t.request || "(untitled)")}</span>
            ${t.progress && !["done", "failed"].includes(t.status) ? `<span style="display:block;margin-top:3px;font:11px var(--mono);color:var(--amber);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">진행 · ${esc(t.progress)}</span>` : ""}
          </span>
          <span class="mono" style="font-size:11px">${esc(t.agent || "—")}</span>
          <span class="mono" style="font-size:11px;color:${stateColor(t.status)}">${esc(t.status)}</span>
          <span class="mono" style="font-size:11px">${fmtTokens(Number(t.tokensIn) + Number(t.tokensOut))}</span>
        </div>`).join("") : `<div class="empty">no tasks yet</div>`}
      </div>
      <div>
        ${blockedCard(state.data.overview.blocked || [])}
        ${serviceCard(services)}
        ${failureCard(wakeFailures)}
      </div>
    </div>
    <div class="card"><h2>설정 경로</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;font:11px var(--mono)">
        ${paths.map((p) => `<div style="display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid #171b19">
          <span style="color:#5f6b64;width:52px;flex:none">${esc(p.label)}</span>
          <span style="color:#b9c3bc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.value)}</span></div>`).join("")}
      </div></div>`;
};

const fmtTokens = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n || 0));

function blockedCard(rows) {
  if (!rows.length) return "";
  return `<div class="card" style="margin-bottom:12px;border-color:#232b31">
    <h2>결정 대기 ${rows.length}건</h2>
    <p class="hint">답을 주면 그 작업이 다시 큐로 들어가고 agent가 이어서 진행합니다.</p>
    ${rows.map((r) => `<div style="padding:12px 0;border-top:1px solid #171b19">
      <div class="mono" style="font-size:11px;color:var(--blue)">#${r.id} ${esc(r.agent)}${r.project ? ` · ${esc(r.project)}` : ""}</div>
      <div style="margin:6px 0 8px;font-size:12.5px;line-height:1.6;color:var(--text)">${esc(r.question || "확인 필요")}</div>
      <div style="display:flex;gap:6px">
        <input id="ans-${r.id}" placeholder="답변" style="flex:1;font:12px var(--mono);padding:7px 9px;border-radius:6px;border:1px solid #1e2422;background:var(--panel2);color:#e6ebe6;outline:none">
        <button class="btn small" data-act="answer" data-id="${r.id}">보내기</button>
      </div>
    </div>`).join("")}
  </div>`;
}

function serviceCard(services) {
  return `<div class="card"><h2>Runtime status</h2><p class="hint">server · postgres · wake · dashboard</p>
    ${services.map((s) => `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #171b19;font:11px var(--mono)">
      <span class="dot" style="background:${stateColor(s.state)}"></span>
      <span style="color:var(--text);width:78px">${esc(s.name)}</span>
      <span style="color:#67726b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.detail)}</span>
      <span style="color:${stateColor(s.state)}">${esc(s.state)}</span></div>`).join("")}</div>`;
}

function failureCard(failures) {
  if (!failures.length) {
    const past = state.data.overview?.stats?.history?.wakeFailures ?? 0;
    return `<div class="card" style="margin-top:12px"><h2>wake 실패 없음</h2>
      <p class="hint" style="margin:0">모든 agent가 세션에 연결돼 있습니다.
      ${past ? `지난 실패 ${past}건은 <a href="#events" style="cursor:pointer">Events</a>에 기록으로 남아 있습니다.` : ""}</p></div>`;
  }
  return `<div class="fail" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:var(--red)"></span>
      <span style="font-size:13px;color:var(--strong);font-weight:500">wake 실패 ${failures.length}건</span></div>
    ${failures.map((f) => `<div class="item">
      <div style="display:flex;align-items:center;gap:8px;font:11px var(--mono)">
        <span style="color:oklch(0.75 0.14 25)">${esc(f.agent)}</span>
        <span style="color:var(--faint)">${esc(f.payload.code || "")}</span>
        <span style="margin-left:auto;color:#3e4744">${time(f.at)}</span></div>
      <div style="margin-top:7px;font:11px/1.6 var(--mono);color:#8b968e">${esc(f.payload.hint || "")}${f.totalFailures > 1 ? ` · 누적 ${f.totalFailures}회` : ""}</div>
      <div style="display:flex;gap:7px;margin-top:10px">
        ${f.agentId ? `<button class="btn small" data-act="wake" data-id="${f.agentId}">wake again</button>
        <button class="btn small" data-act="rebind" data-id="${f.agentId}">rebind session</button>
        <button class="btn small" data-act="dismiss-wake" data-id="${f.agentId}">확인함</button>` : ""}
        <button class="btn small" data-act="open-event" data-id="${f.id}">open log</button>
      </div></div>`).join("")}</div>`;
}

views.agents = () => {
  const { pilo, pms, orphanWorkers } = state.data.tree;
  const projects = state.data.projects;
  const tree = !pilo
    ? `<div class="empty">대표 agent(role=pilo)가 없습니다. 오른쪽 폼에서 등록하세요.</div>`
    : `<div class="node root">
        <span class="dot" style="background:var(--green)"></span>
        <span class="name">${esc(pilo.name)}</span><span class="role pilo">PILO</span>
        <span class="meta">${esc(pilo.runtime || "runtime 미감지")} · ${esc(pilo.cwd || "cwd 없음")}</span>
        <span class="acts">
          <button class="btn small" data-act="rules" data-id="${pilo.id}">rules</button>
          <button class="btn small" data-act="edit-agent" data-id="${pilo.id}">edit</button>
          <button class="btn small" disabled title="대표 agent는 삭제할 수 없습니다">delete</button>
        </span></div>
      <div class="branch">
        ${pms.length ? pms.map(pmNode).join("") : `<div class="sub" style="padding:14px 0">PM agent 없음 — 오른쪽에서 등록</div>`}
        ${orphanWorkers.map((w) => workerNode(w)).join("")}
      </div>`;
  return `<div class="split">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <h2 style="margin:0">조직도</h2><span class="mono" style="font-size:11px;color:#5f6b64">parent_agent_id tree</span>
        <span style="margin-left:auto;display:flex;gap:6px"><span class="role pilo">PILO</span><span class="role pm">PM</span><span class="role worker">WORKER</span></span>
      </div>${tree}</div>
    <div>${rulesCard()}${sessionCard()}${agentForm(projects, pilo, pms)}</div>
  </div>`;
};

function rulesCard() {
  const r = state.rules;
  if (!r) return "";
  return `<div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0">지시문 — ${esc(r.agent.name)}</h2>
      <button class="btn small" data-act="close-rules" style="margin-left:auto">닫기</button></div>
    <p class="hint">아래 내용을 <span class="mono" style="color:#b9c3bc">${esc(r.file)}</span> 의
      <span class="mono">pilo:begin ~ pilo:end</span> 블록에 씁니다.
      ${r.exists ? (r.hasBlock ? "기존 블록만 교체되고" : "파일 끝에 덧붙고") : "파일이 새로 만들어지고"} 나머지 내용은 그대로 둡니다.</p>
    <div class="code" style="max-height:260px;border:1px solid #171b19;border-radius:8px;background:var(--panel2)">
      ${esc(r.preview).split("\n").map((l, i) => `<div class="ln"><span class="n">${i + 1}</span><span class="t" style="white-space:pre-wrap">${l}</span></div>`).join("")}
    </div>
    <button class="btn primary" style="margin-top:12px" data-act="write-rules" data-id="${r.agent.id}">
      ${r.exists && r.hasBlock ? "지시문 갱신하고 세션에 반영" : "지시문 쓰고 세션에 반영"}</button>
    <div class="note">파일을 쓴 뒤 해당 세션에 <span class="mono" style="color:#b9c3bc">[pilo:rules]</span> 프롬프트를 보내 바로 읽게 합니다. 세션 재시작은 필요 없습니다.</div>
  </div>`;
}

function sessionCard() {
  const sessions = state.data.sessions || [];
  const free = sessions.filter((s) => !s.boundAgent);
  return `<div class="card" style="margin-bottom:14px">
    <h2>herdr 세션</h2>
    <p class="hint">떠 있는 세션을 그대로 agent로 등록합니다. runtime·cwd·target은 herdr에서 읽어옵니다.</p>
    ${sessions.length ? sessions.map((s) => `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #171b19;font:11px var(--mono)">
      <span class="dot" style="background:${s.boundAgent ? "var(--faint)" : s.status === "working" ? "var(--amber)" : "var(--green)"}"></span>
      <span style="color:var(--strong);width:52px;flex:none">${esc(s.runtime)}</span>
      <span style="color:#67726b;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(s.cwd)}">${esc(s.cwdShort)}</span>
      ${s.boundAgent
        ? `<span style="color:var(--faint);white-space:nowrap">→ ${esc(s.boundAgent.name)}</span>`
        : `<button class="btn small" data-act="use-session" data-target="${esc(s.target)}">이 세션 추가</button>`}
    </div>`).join("") : `<div class="sub" style="margin-top:10px">herdr 세션이 없습니다. 세션을 띄운 뒤 새로고침하세요.</div>`}
    ${sessions.length && !free.length ? `<div class="note">모든 세션이 이미 등록되어 있습니다.</div>` : ""}
  </div>`;
}

// Whether the pane is actually running something, whoever started it.
function sessionBadge(a) {
  if (!a.herdrTarget) return "";
  const seen = a.sessionStatus || "";
  const busy = seen === "working";
  const label = busy ? "세션 실행 중" : seen ? "세션 대기" : "세션 끊김";
  return `<span class="meta" style="color:${busy ? "var(--amber)" : "var(--faint)"}">${esc(label)}</span>`;
}

function pmNode(pm) {
  return `<div style="padding-top:16px">
    <div class="node">
      <span class="dot" style="background:${stateColor(pm.status)}"></span>
      <span class="name">${esc(pm.name)}</span><span class="role pm">PM</span>
      <span class="meta">${esc(pm.projectName || "project 미지정")} · ${esc(pm.status === "blocked" ? "결정 대기" : pm.runtime || "미감지")}</span>
      ${sessionBadge(pm)}
      <span class="meta">${esc(pm.aliases || "")}</span>
      <span class="acts">
        <button class="btn small" data-act="rules" data-id="${pm.id}">rules</button>
        <button class="btn small" data-act="edit-agent" data-id="${pm.id}">edit</button>
        <button class="btn small danger" data-act="delete-agent" data-id="${pm.id}">delete</button>
      </span></div>
    <div class="branch">${pm.children.map(workerNode).join("") || `<div class="sub" style="padding:10px 0">worker 없음</div>`}</div>
  </div>`;
}

function workerNode(w) {
  return `<div class="node" style="margin-top:10px;padding:10px 14px;border-color:#171b19;background:var(--panel2)">
    <span class="dot" style="background:${stateColor(w.status)}"></span>
    <span class="name" style="font-size:12px;color:#b9c3bc">${esc(w.name)}</span><span class="role worker">WORKER</span>
    ${sessionBadge(w)}
    <span class="meta">${esc(w.specialty || w.note || "")}</span>
    <span class="acts">
      <button class="btn small" data-act="rules" data-id="${w.id}">rules</button>
      <button class="btn small" data-act="edit-agent" data-id="${w.id}">edit</button>
      <button class="btn small danger" data-act="delete-agent" data-id="${w.id}">delete</button>
    </span></div>`;
}

function agentForm(projects, pilo, pms) {
  const f = state.form;
  const piloTaken = Boolean(pilo) && state.editing !== (pilo && pilo.id);
  const roles = [["pilo", "PILO"], ["pm", "PM"], ["worker", "WORKER"]];
  const parents = f.role === "pm" ? (pilo ? [pilo] : []) : f.role === "worker" ? pms : [];
  return `<div class="card">
    <div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0">${state.editing ? "agent 수정" : "agent 등록"}</h2>
      ${state.editing ? `<button class="btn small" data-act="cancel-edit" style="margin-left:auto">취소</button>` : ""}</div>
    <p class="hint">target(세션 핸들)은 herdr에서 자동 감지되므로 입력하지 않습니다.</p>
    <div class="field"><div class="name">name <span class="hint">고유 식별자</span><span class="req">required</span></div>
      <input id="f-name" value="${esc(f.name)}" placeholder="pm-4"></div>
    <div class="field"><div class="name">role <span class="hint">pilo는 정확히 1개</span><span class="req">required</span></div>
      <div class="choices">${roles.map(([v, l]) => {
        const off = v === "pilo" && piloTaken;
        return `<button class="choice ${f.role === v ? "on" : ""}" data-act="role" data-role="${v}" ${off ? "disabled" : ""}>
          ${l}${off ? "<small>이미 등록됨</small>" : ""}</button>`;
      }).join("")}</div></div>
    ${f.role === "pilo" ? "" : `<div class="field"><div class="name">parent <span class="hint">parent_agent_id</span><span class="req">required</span></div>
      <select id="f-parent">${parents.length ? parents.map((p) => `<option value="${p.id}" ${String(f.parentAgentId) === String(p.id) ? "selected" : ""}>${esc(p.name)}</option>`).join("") : `<option value="">${f.role === "pm" ? "pilo agent를 먼저 등록" : "PM agent를 먼저 등록"}</option>`}</select></div>`}
    ${f.role === "pilo" ? "" : `<div class="field"><div class="name">project <span class="hint">이 agent가 담당할 프로젝트</span></div>
      <select id="f-project"><option value="">— 미지정 —</option>
        ${projects.map((p) => `<option value="${p.id}" ${String(f.projectId) === String(p.id) ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
        ${f.projectName && !f.projectId ? `<option value="__auto" selected>+ ${esc(f.projectName)} (등록 시 생성)</option>` : ""}
        <option value="__new">+ Projects 탭에서 직접 만들기…</option></select></div>`}
    <div class="field"><div class="name">cwd <span class="hint">herdr 세션 매칭 기준</span><span class="req">required</span></div>
      <input id="f-cwd" value="${esc(f.cwd)}" placeholder="~/work/project-d"></div>
    <div class="field"><div class="name">runtime <span class="hint">herdr가 감지한 값</span></div>
      <input value="${esc(f.runtime || "등록 시 cwd로 자동 감지")}" disabled style="color:${f.runtime ? "var(--green)" : "var(--faint)"}"></div>
    <div class="field"><div class="name">model <span class="hint">선택 — sonnet, opus 같은 메모</span></div>
      <input id="f-model" value="${esc(f.model)}" placeholder="비워둬도 됩니다"></div>
    <div class="field"><div class="name">specialty <span class="hint">전문 영역</span></div>
      <input id="f-specialty" value="${esc(f.specialty)}" placeholder="backend, migration"></div>
    <div class="field"><div class="name">aliases <span class="hint">쉼표로 구분</span></div>
      <input id="f-aliases" value="${esc(f.aliases)}" placeholder="@d, dd"></div>
    <div class="field"><div class="name">note <span class="hint">메모</span></div>
      <input id="f-note" value="${esc(f.note)}" placeholder="PoC 담당"></div>
    <div class="note" style="display:flex;gap:10px;align-items:center">
      <span>target</span><span style="color:#b9c3bc">${state.editing ? esc(currentTarget()) : "등록 시 cwd로 자동 감지"}</span>
      ${state.editing ? `<button class="btn small" data-act="rebind" data-id="${state.editing}" style="margin-left:auto">rebind</button>` : `<span style="margin-left:auto;color:#3e4744">auto</span>`}
    </div>
    ${state.candidates.length > 1 ? `<div class="note">
      <div style="color:#b9c3bc;margin-bottom:6px">후보 ${state.candidates.length}개 — 하나를 고르세요</div>
      ${state.candidates.map((c) => `<div style="display:flex;gap:8px;align-items:center;padding:4px 0">
        <span>${esc(c.runtime)} · ${esc(c.target)} · ${esc(c.title || "")}</span>
        <button class="btn small" data-act="pick-target" data-target="${esc(c.target)}" style="margin-left:auto">bind</button></div>`).join("")}</div>` : ""}
    ${state.editing ? "" : `<label style="display:flex;align-items:center;gap:9px;margin:14px 0 0;font:11px var(--mono);color:#9aa59d;cursor:pointer">
      <input type="checkbox" id="f-write-rules" ${f.writeRules ? "checked" : ""} style="width:auto;margin:0">
      등록과 함께 ${f.runtime === "claude" ? "CLAUDE.md" : "AGENTS.md"} 쓰고 세션에 반영</label>`}
    <button class="btn primary" data-act="${state.editing ? "update-agent" : "create-agent"}">${state.editing ? "save agent" : "register agent"}</button>
  </div>`;
}

function currentTarget() {
  const all = [state.data.tree.pilo, ...state.data.tree.pms, ...state.data.tree.pms.flatMap((p) => p.children), ...state.data.tree.orphanWorkers].filter(Boolean);
  const found = all.find((a) => String(a.id) === String(state.editing));
  return found?.herdrTarget || "미바인딩";
}

// Who a request went to, once it has gone anywhere. Project first — that is the
// name the user thinks in — and the agents only when there is no project.
function routedBadge(item) {
  const parts = String(item.project || item.routed || "").split(", ").filter(Boolean);
  // Nobody was handed it, so the desk agent answered it itself.
  if (!parts.length) return { text: "PILO", color: "var(--green)" };
  const text = parts.length > 2 ? `${parts[0]} +${parts.length - 1}` : parts.join(" · ");
  const pms = (state.data.tree?.pms) || [];
  const workers = pms.flatMap((pm) => pm.children || []);
  const owns = (agents) => agents.some((a) => parts.includes(a.name) || parts.includes(a.projectName));
  return { text, color: owns(pms) || !owns(workers) ? "var(--blue)" : "var(--muted)" };
}

// Same rule the TUI filters by: a request belongs to every project it was
// handed to, and one that has been handed nowhere is 미배분.
const inboxProjects = (item) => String(item.project || "").split(", ").filter(Boolean);

function matchesFilter(item) {
  if (!state.inboxFilter) return true;
  const names = inboxProjects(item);
  return state.inboxFilter === "__none" ? !names.length : names.includes(state.inboxFilter);
}

views.inbox = () => {
  const all = state.data.inbox;
  if (!all.length) return `<div class="table"><div class="empty">inbox가 비어 있습니다. TUI에서 지시를 입력하면 여기에 쌓입니다.</div></div>`;
  const names = [...new Set(all.flatMap(inboxProjects))].sort();
  const list = all.filter(matchesFilter);
  const chip = (name, text) => `<button class="chip ${state.inboxFilter === name ? "on" : ""}" data-act="filter-inbox" data-name="${esc(name || "")}">${esc(text)}</button>`;
  const chips = `<div class="chips">${chip(null, "전체")}${names.map((n) => chip(n, n)).join("")}${
    all.some((i) => !inboxProjects(i).length) ? chip("__none", "PILO") : ""}</div>`;

  // Keep the open request selected while it survives the filter.
  const current = list.some((i) => String(i.id) === String(state.selected.inbox))
    ? state.selected.inbox
    : list[0]?.id;
  const detail = state.data.inboxDetail;
  const label = { queued: "대기", dispatched: "처리 중", replied: "완료", failed: "실패" };
  const stateOf = (i) => (i.needsReply ? "답변 저장 필요" : label[i.status] || i.status);

  let day = "";
  const rows = list.map((i) => {
    const group = dayLabel(i.createdAt);
    const header = group === day ? "" : `<div class="daygroup">${esc(group)}</div>`;
    day = group;
    const done = i.status === "replied";
    return `${header}<button class="list-item ${String(i.id) === String(current) ? "on" : ""}" data-act="open-inbox" data-id="${i.id}">
      <span style="display:flex;align-items:center;gap:8px">
        <span class="dot" style="background:${done ? "var(--green)" : i.status === "failed" || i.needsReply ? "var(--red)" : "var(--amber)"}"></span>
        <span style="flex:none;font:10px var(--mono);color:${routedBadge(i).color}">[${esc(routedBadge(i).text)}]</span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-size:12.5px">${esc(firstLine(i.userRequest))}</span>
      </span>
      <span style="display:flex;gap:8px;margin-top:6px;font:10px var(--mono);color:var(--faint)">
        <span>${ago(i.createdAt)}</span><span>·</span><span style="${i.needsReply ? "color:var(--red)" : ""}">${esc(stateOf(i))}</span>
        ${i.project ? `<span style="margin-left:auto;color:#67726b">${esc(i.project)}</span>` : ""}
      </span>
    </button>`;
  }).join("");

  return `<div class="inbox">
    <div class="table">
      <div class="title">요청 <span class="mono" style="margin-left:auto;font-size:11px;color:#5f6b64">${list.length}건${

      ${chips}
      ${rows || `<div class="empty">이 필터에 맞는 요청이 없습니다.</div>`}
    </div>
    ${detail && String(detail.id) === String(current) ? inboxDetail(detail) : `<div class="table"><div class="empty">요청을 선택하세요</div></div>`}

};

function dayLabel(at) {
  if (!at) return "이전";
  const d = new Date(at);
  const today = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, today)) return "오늘";
  const yesterday = new Date(today.getTime() - 86400000);
  if (same(d, yesterday)) return "어제";
  return d.toLocaleDateString("ko-KR", { month: "long", day: "numeric" });
}

// pm_result is markdown written for a human reader; for a one-line preview the
// syntax is just noise.
function summarize(text, limit = 150) {
  const flat = String(text || "")
    .replace(/```[\s\S]*?```/g, " [코드] ")
    .replace(/^#{1,6}\s*/gm, "")
    .replace(/[*_`>]/g, "")
    .replace(/\s+/g, " ")
    .trim();
  return flat.length > limit ? flat.slice(0, limit) + "…" : flat || "(내용 없음)";
}

const firstLine = (text) => {
  const lines = String(text || "").split("\n").map((l) => l.trim()).filter(Boolean);
  const names = (state.data?.agents || []).map((a) => a.name);
  const start = lines.length > 1 && (lines[0].length <= 12 || names.includes(lines[0])) ? 1 : 0;
  const line = lines[start] || lines[0] || "(빈 요청)";
  return line.length > 60 ? line.slice(0, 60) + "…" : line;
};

function ago(at) {
  if (!at) return "—";
  const diff = (Date.now() - new Date(at)) / 1000;
  if (diff < 60) return "방금";
  if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
  return `${Math.floor(diff / 86400)}일 전`;
}

const STAGE = {
  inbox: { label: "요청", color: "var(--muted)" },
  dispatch: { label: "배분", color: "var(--blue)" },
  pm_result: { label: "PM 결과", color: "var(--blue)" },
  final_reply: { label: "최종 답변", color: "var(--green)" }
};

// A note is only news while its task is still open; once the task is done the
// result speaks for it, and the note stays in Events as history.
const inFlight = (t) => t.progress && !["done", "failed"].includes(t.status);

// Every task finished and no answer was written. The dashboard does not write
// it either — it shows what the answer would be made of and leaves the wording
// to the desk agent.
function needsReplyCard(detail) {
  const finished = detail.tasks.filter((t) => ["done", "failed"].includes(t.status));
  const waiting = detail.tasks.length && finished.length === detail.tasks.length;
  if (!waiting) {
    return `<div class="card"><span class="sub">아직 최종 답변이 없습니다 — ${
      esc(detail.tasks.map((t) => t.agent).filter(Boolean).join(", ") || "배분 대기")}</span></div>`;
  }
  const one = finished.length === 1 ? finished[0] : null;
  return `<div class="card" style="border-color:#3a2422">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
      <span class="role" style="color:var(--red);border-color:#3a2422">답변 저장 필요</span>
      <span class="mono" style="font-size:10px;color:var(--faint)">task ${finished.length}건 완료 · final_reply 없음</span>
      ${one ? `<button class="btn small" data-act="copy-pm-result" data-id="${one.id}" style="margin-left:auto">PM 결과 복사</button>` : ""}
    </div>
    ${one
      ? `<div class="sub" style="margin-bottom:8px">${esc(one.agent || "agent")}의 결과를 그대로 쓰거나 다듬어 저장하세요 — <code>pilo reply ${esc(detail.id)} "…"</code></div>
         <div style="white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--text)">${prose(one.pmResult || "(결과 본문 없음)")}</div>`
      : `<div class="sub">${esc(finished.map((t) => t.agent).filter(Boolean).join(", "))} 결과 ${finished.length}건을 취합해 하나의 답변으로 저장해야 합니다 — <code>pilo reply ${esc(detail.id)} "…"</code></div>`}
  </div>`;
}

function inboxDetail(detail) {
  const reply = detail.replies[detail.replies.length - 1];
  const steps = detail.trace.filter((t) => t.stage !== "inbox");
  return `<div style="display:flex;flex-direction:column;gap:12px;min-width:0">
    <div class="card">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
        <span class="label">요청 in-${esc(detail.id)}</span>
        <span class="mono" style="font-size:10px;color:var(--faint)">${stamp(detail.createdAt)}</span>
        <span class="mono" style="margin-left:auto;font-size:10px;color:var(--faint)">task ${detail.tasks.length}건</span>
      </div>
      <div style="white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--text)">${prose(detail.userRequest)}</div>
    </div>

    ${reply ? `<div class="card" style="border-color:#24312c;background:linear-gradient(180deg,#101413,#0b0e0d)">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
        <span class="role pilo">최종 답변</span>
        <span class="mono" style="font-size:10px;color:var(--faint)">${esc(reply.agent || "pilo")} · ${ago(reply.createdAt)}</span>
      </div>
      <div style="white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--text)">${prose(reply.body)}</div>
    </div>` : needsReplyCard(detail)}

    ${detail.tasks.some(inFlight) ? `<div class="card">
      <div class="label" style="margin-bottom:8px">진행 상황</div>
      ${detail.tasks.filter(inFlight).map((t) => `<div class="step">
        <span style="flex:none;width:62px;font:10px var(--mono);color:var(--amber)">진행</span>
        <div style="flex:1;min-width:0">
          <div class="mono" style="font-size:10px;color:var(--faint)">${esc(t.agent || "agent")} · task #${esc(t.id)} · ${ago(t.progressAt)}</div>
          <div class="body" style="margin-top:5px">${prose(t.progress)}</div>
        </div>
      </div>`).join("")}
    </div>` : ""}

    <div class="card">
      <div class="label" style="margin-bottom:4px">처리 경로</div>
      ${steps.length ? steps.map((t, i) => {
        const meta = STAGE[t.stage] || { label: t.stage, color: "var(--muted)" };
        const key = `${detail.id}-${i}`;
        const open = state.openTrace === key;
        const long = String(t.text || "").length > 160;
        return `<div class="step">
          <span style="flex:none;width:62px;font:10px var(--mono);color:${meta.color}">${esc(meta.label)}</span>
          <div style="flex:1;min-width:0">
            <div class="mono" style="font-size:10px;color:var(--faint)">${esc(t.who)} · ${ago(t.at)}</div>
            <div class="body ${long && !open ? "short" : ""}" style="margin-top:5px">${open || !long ? prose(t.text) : esc(summarize(t.text, 220))}</div>
            ${long ? `<button class="btn small" style="margin-top:8px" data-act="toggle-trace" data-key="${key}">${open ? "접기" : "전체 보기"}</button>` : ""}
          </div>
        </div>`;
      }).join("") : `<div class="sub" style="padding-top:10px">아직 배분되지 않았습니다.</div>`}
    </div>
  </div>`;
}

          <span style="color:var(--strong);width:66px">${esc(s.runtime)}</span>
          <span style="color:#67726b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.cwd)}</span>
          <span style="color:var(--faint)">${esc(s.target)}</span></div>`).join("") : `<div class="sub">herdr 세션이 감지되지 않았습니다.</div>`}
      </div>
    </div>
  </div>`;
};

views.system = () => {
  const sys = state.data.system;
  return `<div class="half">
    <div>
      ${serviceCard(sys.services)}
      <div class="card" style="margin-top:12px"><h2>명령</h2>
        <div style="font:11px/2 var(--mono);color:#8b968e;margin-top:10px">
          ${sys.commands.map((c) => `<div>${esc(c.cmd).padEnd(12, " ").replace(/ /g, "&nbsp;")}<span style="color:var(--faint)">${esc(c.desc)}</span></div>`).join("")}
        </div></div>
      <div class="card" style="margin-top:12px"><h2>설정 경로</h2>
        ${sys.paths.map((p) => `<div style="display:flex;gap:12px;padding:10px 0;border-top:1px solid #171b19;font:11px var(--mono)">
          <span style="color:#5f6b64;width:64px;flex:none">${esc(p.label)}</span>
          <span style="color:#b9c3bc;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.value)}</span>
          <span style="color:#3e4744">${esc(p.note)}</span></div>`).join("")}</div>
    </div>
    <div>
      ${sys.wakeFailures.length ? `<div class="fail">
        <div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:var(--red)"></span>
          <span style="font-size:13px;color:var(--strong);font-weight:500">wake 실패 목록</span></div>
        <p class="hint" style="margin:8px 0 0">herdr 세션을 깨우지 못한 기록입니다. 재시도하거나 세션을 다시 바인딩하세요.</p>
        ${sys.wakeFailures.map((f) => `<div class="item">
          <div style="display:flex;gap:9px;font:11px var(--mono)"><span style="color:oklch(0.75 0.14 25)">${esc(f.agent)}</span>
            <span style="color:var(--faint)">${esc(f.payload.code || "")}</span><span style="margin-left:auto;color:#3e4744">${stamp(f.at)}</span></div>
          <div style="margin-top:7px;font:11px/1.6 var(--mono);color:#8b968e">${esc(f.payload.hint || "")}</div>
          <div style="margin-top:7px;font:11px var(--mono);color:#5f6b64">누적 ${esc(f.totalFailures || 1)}회 · runtime ${esc(f.payload.runtime || "—")}</div>
          <div style="display:flex;gap:7px;margin-top:11px">
            ${f.agentId ? `<button class="btn small" data-act="wake" data-id="${f.agentId}">wake again</button>
            <button class="btn small" data-act="rebind" data-id="${f.agentId}">rebind session</button>
            <button class="btn small" data-act="dismiss-wake" data-id="${f.agentId}">확인함</button>` : ""}
            <button class="btn small" data-act="open-event" data-id="${f.id}">open log</button></div>
        </div>`).join("")}</div>`
      : `<div class="card"><h2>wake 실패 없음</h2><p class="hint" style="margin:0">모든 agent가 세션에 연결돼 있습니다. 지난 기록은 Events 탭에 남습니다.</p></div>`}
      <div class="card" style="margin-top:12px"><h2>herdr 세션</h2><p class="hint">cwd가 같은 세션이 agent에 자동으로 바인딩됩니다.</p>
        ${sys.sessions.length ? sys.sessions.map((s) => `<div style="display:flex;gap:10px;padding:10px 0;border-top:1px solid #171b19;font:11px var(--mono)">
          <span class="dot" style="background:${s.status === "working" ? "var(--amber)" : "var(--green)"};margin-top:5px"></span>
          <span style="color:var(--strong);width:56px">${esc(s.runtime)}</span>
          <span style="color:#67726b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.cwd)}</span>
          <span style="color:var(--faint)">${esc(s.target)}</span></div>`).join("") : `<div class="sub">herdr 세션 없음</div>`}
      </div>
    </div>
  </div>`;
};

/* ---------- actions ---------- */
function readAgentForm() {
  const val = (id) => ($(id) ? $(id).value.trim() : "");
  return {
    name: val("f-name"),
    role: state.form.role,
    parentAgentId: $("f-parent") ? $("f-parent").value || null : null,
    projectId: $("f-project") && !["__new", "__auto", ""].includes($("f-project").value) ? $("f-project").value : null,
    projectName: $("f-project") && $("f-project").value === "__auto" ? state.form.projectName : "",
    cwd: val("f-cwd"),
    model: val("f-model"),
    specialty: val("f-specialty"),
    aliases: val("f-aliases"),
    note: val("f-note"),
    writeRules: $("f-write-rules") ? $("f-write-rules").checked : false
  };
}

function keepAgentForm() {
  if (!$("f-name")) return;
  state.form = { ...state.form, ...readAgentForm(), role: state.form.role, projectName: state.form.projectName };
}

function readProjectForm() {
  return {
    name: $("p-name").value.trim(),
    repo: $("p-repo").value.trim(),
    path: $("p-path").value.trim(),
    note: $("p-note").value.trim()
  };
}

const actions = {
  async "role"(el) {
    keepAgentForm();
    state.form.role = el.dataset.role;
    state.form.parentAgentId = "";
    render();
  },
  async "use-session"(el) {
    const session = (state.data.sessions || []).find((s) => s.target === el.dataset.target);
    if (!session) return;
    const { pilo, pms } = state.data.tree;
    const role = pilo ? "pm" : "pilo";
    state.editing = null;
    state.candidates = [];
    state.form = {
      ...emptyForm(),
      name: session.suggestedName,
      role,
      parentAgentId: role === "pm" ? (pilo ? pilo.id : "") : "",
      projectId: role === "pilo" ? "" : session.suggestedProjectId || "",
      projectName: role === "pilo" ? "" : session.suggestedProjectId ? "" : session.suggestedProjectName,
      cwd: session.cwd,
      runtime: session.runtime
    };
    if (role === "pilo") state.form.name = "pilo";
    toast(`${session.runtime} 세션을 폼에 채웠습니다 — role 확인 후 등록`);
    render();
  },
  async "rules"(el) {
    state.rules = await get(`/api/agents/${el.dataset.id}/rules`);
    state.tab = "agents";
    render();
  },
  async "toggle-trace"(el) {
    state.openTrace = state.openTrace === el.dataset.key ? null : el.dataset.key;
    render();
  },
  async "close-rules"() {
    state.rules = null;
    render();
  },
  async "write-rules"(el) {
    const res = await call("POST", `/api/agents/${el.dataset.id}/rules`, {});
    toast(
      `${res.updated ? "갱신" : "생성"}: ${res.file.split("/").pop()}` +
        (res.notified ? " · 세션에 반영 요청 보냄" : ` · 세션 알림 실패 (${res.reason})`),
      !res.notified
    );
    state.rules = await get(`/api/agents/${el.dataset.id}/rules`);
    render();
  },
  async "create-agent"() {
    const form = readAgentForm();
    if (!form.name || !form.cwd) return toast("name과 cwd는 필수입니다", true);
    const res = await call("POST", "/api/agents", form);
    state.candidates = res.candidates || [];
    state.form = emptyForm();
    const wrote = res.rules && !res.rules.error
      ? ` · ${res.rules.file.split("/").pop()} ${res.rules.updated ? "갱신" : "생성"}${res.rules.notified ? " · 세션 반영" : ""}`
      : "";
    if (res.rules?.error) toast(`등록됨, 지시문 실패: ${res.rules.error}`, true);
    else toast(`${state.candidates.length > 1 ? "등록됨 — 세션 후보 여러 개" : "agent 등록됨"}${wrote}`);
    await load();
  },
  async "edit-agent"(el) {
    const id = el.dataset.id;
    const all = [state.data.tree.pilo, ...state.data.tree.pms, ...state.data.tree.pms.flatMap((p) => p.children), ...state.data.tree.orphanWorkers].filter(Boolean);
    const a = all.find((x) => String(x.id) === String(id));
    if (!a) return;
    state.editing = id;
    state.form = {
      name: a.name, role: a.role, parentAgentId: a.parentAgentId || "", projectId: a.projectId || "",
      cwd: a.cwd || "", model: a.model || "", specialty: a.specialty || "", aliases: a.aliases || "", note: a.note || ""
    };
    state.tab = "agents";
    render();
  },
  async "update-agent"() {
    await call("PATCH", `/api/agents/${state.editing}`, readAgentForm());
    state.editing = null;
    state.form = emptyForm();
    toast("agent 수정됨");
    await load();
  },
  async "cancel-edit"() {
    state.editing = null;
    state.form = emptyForm();
    render();
  },
  async "delete-agent"(el) {
    if (!confirm("이 agent를 삭제할까요? 과거 기록은 그대로 남습니다.")) return;
    await call("DELETE", `/api/agents/${el.dataset.id}`);
    toast("agent 삭제됨");
    await load();
  },
  async "rebind"(el) {
    const res = await call("POST", `/api/agents/${el.dataset.id}/rebind`, {});
    state.candidates = res.candidates || [];
    state.editing = state.editing || el.dataset.id;
    toast(res.target ? `세션 재바인딩: ${res.target}` : `후보 ${state.candidates.length}개 — 하나를 고르세요`, !res.target);
    await load();
  },
  async "pick-target"(el) {
    await call("POST", `/api/agents/${state.editing}/rebind`, { target: el.dataset.target });
    state.candidates = [];
    toast("세션 바인딩됨");
    await load();
  },
  async "wake"(el) {
    try {
      await call("POST", `/api/agents/${el.dataset.id}/wake`, {});
      toast("wake 신호를 보냈습니다");
    } catch (err) {
      toast(`wake 실패: ${err.message}`, true);
    }
    await load();
  },
  async "answer"(el) {
    const field = $(`ans-${el.dataset.id}`);
    const body = field ? field.value.trim() : "";
    if (!body) return toast("답변을 입력하세요", true);
    await call("POST", `/api/tasks/${el.dataset.id}/answer`, { body });
    toast(`#${el.dataset.id} 회신 — agent를 다시 깨웁니다`);
    await load();
  },
  async "dismiss-wake"(el) {
    await call("POST", `/api/agents/${el.dataset.id}/dismiss-wake`, {});
    toast("확인 처리됨 — 기록은 Events에 남습니다");
    await load();
  },
  async "filter-inbox"(el) {
    const name = el.dataset.name || null;
    state.inboxFilter = state.inboxFilter === name ? null : name;
    const shown = state.data.inbox.filter(matchesFilter);
    // The detail pane follows the list, so pull the first survivor into it.
    if (shown.length && !shown.some((i) => String(i.id) === String(state.selected.inbox))) {
      state.selected.inbox = shown[0].id;
      state.data.inboxDetail = await get(`/api/inbox/${shown[0].id}`);
    }
    render();
  },

  async "open-inbox"(el) {
    state.selected.inbox = el.dataset.id;
    state.data.inboxDetail = await get(`/api/inbox/${el.dataset.id}`);
    render();
  },
  async "open-event"(el) {
    state.tab = "events";
    state.selected.event = el.dataset.id;
    state.data.eventDetail = await get(`/api/events/${el.dataset.id}`);
    render();
  },
  async "open-artifact"(el) {
    state.selected.artifact = el.dataset.id;
    state.data.artifactDetail = await get(`/api/artifacts/${el.dataset.id}`);
    render();
  },
  async "copy-pm-result"(el) {
    const task = (state.data.inboxDetail?.tasks || []).find((t) => String(t.id) === String(el.dataset.id));
    await navigator.clipboard.writeText(task?.pmResult || "");
    toast("PM 결과 복사됨");
  },

  async "copy-json"() {
    await navigator.clipboard.writeText(JSON.stringify(state.data.eventDetail.payload, null, 2));
    toast("payload 복사됨");
  },
  async "copy-diff"() {
    await navigator.clipboard.writeText(state.data.artifactDetail.diff || "");
    toast("diff 복사됨");
  },
  async "create-project"() {
    const form = readProjectForm();
    if (!form.name) return toast("name은 필수입니다", true);
    await call("POST", "/api/projects", form);
    state.project = { id: null, name: "", repo: "", path: "", note: "" };
    toast("프로젝트 등록됨");
    await load();
  },
  async "edit-project"(el) {
    const p = state.data.projects.find((x) => String(x.id) === String(el.dataset.id));
    state.project = { id: p.id, name: p.name, repo: p.repo || "", path: p.path || "", note: p.note || "" };
    render();
  },
  async "update-project"() {
    await call("PATCH", `/api/projects/${state.project.id}`, readProjectForm());
    state.project = { id: null, name: "", repo: "", path: "", note: "" };
    toast("프로젝트 수정됨");
    await load();
  },
  async "cancel-project"() {
    state.project = { id: null, name: "", repo: "", path: "", note: "" };
    render();
  },
  async "delete-project"(el) {
    if (!confirm("이 프로젝트를 삭제할까요?")) return;
    await call("DELETE", `/api/projects/${el.dataset.id}`);
    toast("프로젝트 삭제됨");
    await load();
  },
  async "toggle-rule"(el) {
    const rules = state.data.settings.notifications.map((r, i) => (i === Number(el.dataset.key) ? { ...r, on: !r.on } : r));
    await call("PUT", "/api/settings/notifications", { value: rules });
    toast("알림 규칙 저장됨");
    await load();
  },
  async "toggle-token"(el) {
    const tokens = { ...state.data.settings.tokens };
    tokens[el.dataset.key] = tokens[el.dataset.key] === false;
    await call("PUT", "/api/settings/tokens", { value: tokens });
    toast("토큰 표시 설정 저장됨");
    await load();
  },
  async "retention"(el) {
    const retention = { ...state.data.settings.retention, [el.dataset.key]: Number(el.dataset.days) };
    await call("PUT", "/api/settings/retention", { value: retention });
    toast("보관 기간 저장됨 (삭제는 2차)");
    await load();
  }
};

function wire() {
  document.querySelectorAll("[data-tab]").forEach((el) => {
    el.onclick = async () => {
      state.tab = el.dataset.tab;
      location.hash = state.tab;
      render();
      await loadDetail();
      render();
    };
  });
  document.querySelectorAll("[data-act]").forEach((el) => {
    el.onclick = async () => {
      const run = actions[el.dataset.act];
      if (!run) return;
      try {
        await run(el);
      } catch (err) {
        toast(err.message, true);
      }
    };
  });
  const project = $("f-project");
  if (project) {
    project.onchange = () => {
      if (project.value === "__new") {
        keepAgentForm();
        state.tab = "projects";
        project.value = "";
        render();
      }
    };
  }
}

window.addEventListener("hashchange", async () => {
  state.tab = location.hash.slice(1) || "overview";
  render();
  await loadDetail();
  render();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

await load();
setInterval(async () => {
  if (document.hidden) return;
  if (document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  try {
    await load();
  } catch (err) {
    $("sync").textContent = "연결 끊김";
  }
}, 5000);
</script>
</body>
</html>
