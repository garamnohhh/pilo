views.agents = () => {
  // The handoff's fold: a PM row with workers folds them from anywhere on the row,
  // and says which way it stands with + (folded) or − (open) after its plate.
  const kids = new Map();
  const parentOf = new Map();
  (state.data.tree?.pms || []).forEach((pm) => {
    kids.set(String(pm.id), (pm.children || []).length);
    (pm.children || []).forEach((w) => parentOf.set(String(w.id), pm.name));
  });
  const rows = treeRows().filter(({ a, lvl }) => !(lvl > 1 && state.fold[parentOf.get(String(a.id))]));
  const st = state.data.overview?.stats || {};
  const bound = (state.data.sessions || []).filter((x) => !x.boundAgent).length;
  return page(
    pageHead(T("desk.title.agents"), `${st.pilo ?? 0} pilo · ${st.pm ?? 0} pm · ${st.worker ?? 0} worker`,
      `${btn(T("desk.act.resendRules"), "resend-rules", "", "gn-btn-ghost")}${btn(T("desk.act.addAgent"), "add-agent")}`) +
    `<div class="gn-ladder gn-ladder-bar">${rows.map(({ a, lvl }) => {
      const role = a.role.toUpperCase();
      const colour = agentTone(a);
      const canFold = lvl > 0 && (kids.get(String(a.id)) || 0) > 0;
      const folded = Boolean(state.fold[a.name]);
      const fold = canFold ? ` data-fold="on" role="button" tabindex="0" aria-expanded="${!folded}" data-act="fold-agent" data-name="${esc(a.name)}"` : "";
      return `<div class="gn-ladder-row">
        <span class="gn-ladder-indent" data-level="${lvl}"></span>
        <span class="gn-ladder-block" data-role="${role.toLowerCase()}"${fold}>
          <span class="gn-ladder-plate" data-role="${role.toLowerCase()}">${role}</span>
          <span class="gn-ladder-twist">${canFold ? (folded ? "+" : "−") : ""}</span>
          <span class="gn-ladder-name">${esc(a.name)}</span>
          ${runtimeMark(a.runtime)}
          <span class="d-m" style="font-size:11px;color:var(--text-2);padding-left:8px;flex:none">${esc(a.herdrTarget || "no session")}</span>
          <span class="d-dot${a.status === "running" ? " d-live" : ""}" style="background:${colour};margin-left:10px"></span>
          <span class="gn-ladder-note" style="color:${colour}">${esc(agentNote(a))}</span>
          <button class="gn-btn gn-btn-sm gn-btn-ghost" style="margin-right:8px;flex:none" data-act="open-agent" data-id="${a.id}">open</button>
        </span></div>`;
    }).join("")}</div>` +
    `<div class="d-hint">A child row starts where its parent's plate ends. Click a PM row anywhere to fold its workers. open holds everything about one agent — rules, binding, waking, removal.
      ${bound ? `${bound} herdr session${bound > 1 ? "s" : ""} not registered yet — Add agent picks one up.` : ""}</div>`
  );
};

// A request belongs to every project it was handed to; one handed nowhere is
// the desk's own.
const inboxProjects = (item) => String(item.project || "").split(", ").filter(Boolean);
const inboxAgents = (item) => String(item.routed || "").split(", ").filter(Boolean);

function dayLabel(at) {
  if (!at) return "older";
  const d = new Date(at);
  const today = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, today)) return "today";
  if (same(d, new Date(today.getTime() - 86400000))) return "yesterday";
  return d.toLocaleDateString("ko-KR", { month: "long", day: "numeric" });
}

function ago(at) {
  if (!at) return "—";
  const diff = (Date.now() - new Date(at)) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return `${Math.floor(diff / 60)}m`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
  return `${Math.floor(diff / 86400)}d`;
}

const firstLine = (text) => {
  const lines = String(text || "").split("\n").map((l) => l.trim()).filter(Boolean);
  const names = (state.data?.agents || []).map((a) => a.name);
  const start = lines.length > 1 && (lines[0].length <= 12 || names.includes(lines[0])) ? 1 : 0;
  const line = lines[start] || lines[0] || "(empty request)";
  return line.length > 90 ? line.slice(0, 90) + "…" : line;
};

// A note is only news while its task is still open; once it is done the result
// speaks for it.
const inFlight = (t) => t.progress && !["done", "failed"].includes(t.status);
const STAGE = { inbox: "request", dispatch: "handed on", pm_result: "result", final_reply: "answer" };
// A request's own state, which is not an agent's. The two used to share the
// word "working" — a request open because one abandoned task never closed read
// as though its agent were busy, while the agent column beside it said stalled.
// Nothing here can be mistaken for one of agentNote()'s words.
const reqState = (i) => (i.needsReply ? "needs an answer"
  : { queued: "not handed on", dispatched: "open", replied: "answered", failed: "failed" }[i.status] || i.status);
const reqColor = (i) => (i.needsReply || i.status === "failed" ? ERR : i.status === "replied" ? OK : WARN);
const isOpen = (i) => i.status !== "replied";

// ---------- REQUESTS ----------
// The filter list is the tree itself, so picking an agent and seeing who it
// reports to are the same act.
views.inbox = () => {
  const all = state.data.inbox || [];
  const byState = all.filter((i) => (state.reqFilter === "All" ? true : state.reqFilter === "Closed" ? !isOpen(i) : isOpen(i)));
  const rows = byState.filter((i) => !state.reqAgent || inboxAgents(i).includes(state.reqAgent) || inboxProjects(i).includes(state.reqAgent));
  const detail = state.data.inboxDetail;
  const countFor = (name) => byState.filter((i) => inboxAgents(i).includes(name) || inboxProjects(i).includes(name)).length;

  const agentOpts = [`<button class="d-plain d-tr d-rowbtn d-pick" aria-selected="${!state.reqAgent}" style="grid-template-columns:minmax(0,1fr) 32px;min-height:34px;padding-left:12px" data-act="req-agent" data-name="">
      <span style="display:flex;align-items:center;gap:8px;min-width:0"><span class="d-clip" style="font-size:var(--fs-body)">${T("desk.lbl.everyAgent")}</span></span>
      <span class="d-m d-num" style="font-size:12px;color:var(--text-3)">${byState.length}</span></button>`]
    .concat(treeRows().map(({ a, lvl }) => {
      const role = a.role.toUpperCase();
      return `<button class="d-plain d-tr d-rowbtn d-pick" aria-selected="${state.reqAgent === a.name}" style="grid-template-columns:minmax(0,1fr) 32px;min-height:34px;padding-left:${12 + lvl * 18}px" data-act="req-agent" data-name="${esc(a.name)}">
        <span style="display:flex;align-items:center;gap:8px;min-width:0">
          ${lvl ? `<span class="d-m" style="color:var(--text-3);font-size:12px;flex:none">└</span>` : ""}
          <span class="d-dot${a.status === "running" ? " d-live" : ""}" style="background:${agentTone(a)}"></span>
          <span class="d-clip" style="font-size:var(--fs-body)">${esc(a.name)}</span>
          <span class="d-chip" style="color:${roleFg(role)};background:${roleBg(role)};flex:none">${role}</span>
        </span>
        <span class="d-m d-num" style="font-size:12px;color:var(--text-3)">${countFor(a.name)}</span></button>`;
    })).join("");

  let day = "";
  const reqRows = rows.map((i) => {
    const group = dayLabel(i.createdAt);
    const header = group === day ? "" : `<div class="d-tr" style="grid-template-columns:minmax(0,1fr);min-height:30px"><span class="d-lbl">${esc(group)}</span></div>`;
    day = group;
    return `${header}<button class="d-plain d-tr d-rowbtn d-pick" aria-selected="${String(i.id) === String(state.selected.inbox)}" style="grid-template-columns:minmax(0,1fr);min-height:auto;padding:10px 4px 10px 12px" data-act="open-inbox" data-id="${i.id}">
      <span style="display:flex;align-items:center;gap:10px;min-width:0">
        <span class="d-m" style="font-size:12px;color:var(--text-3);flex:none">${hhmm(i.createdAt)}</span>
        <span class="d-m d-clip" style="font-size:12px;color:var(--text-2);flex:none">${esc(inboxAgents(i)[0] || "pilo")}</span>
        <span class="d-m" style="margin-left:auto;font-size:11px;color:${reqColor(i)};flex:none">${esc(reqState(i))}</span>
      </span>
      <span class="d-clip" style="display:block;margin-top:4px;font-size:var(--fs-body)">${esc(firstLine(i.userRequest))}</span></button>`;
  }).join("");

  const handling = detail && String(detail.id) === String(state.selected.inbox)
    ? `<div style="min-width:0">
        <div class="d-lblrule"><span class="d-lbl">${T("desk.lbl.handling")}</span>
          <span class="d-m" style="margin-left:auto;font-size:11px;color:var(--text-3)">in-${esc(detail.id)} · ${detail.tasks.length} tasks</span></div>
        <div style="padding:16px 4px 0">
          <div class="md" style="font-size:var(--fs-body);line-height:1.62">${prose(detail.userRequest)}</div>
          <div class="d-m" style="margin-top:8px;font-size:12px;color:var(--text-3)">${stamp(detail.createdAt)} · ${esc(detail.status)}</div>
        </div>
        <div class="d-list" style="margin-top:24px">${(detail.trace || []).filter((t) => t.stage !== "inbox").map((t) => `
          <div class="d-tr" style="grid-template-columns:132px minmax(0,1fr);align-items:start;min-height:auto;padding:12px 4px">
            <span class="d-m" style="font-size:12px;color:${t.stage === "final_reply" ? ACCT : t.stage === "pm_result" ? INFO : "var(--text-3)"}">${esc(STAGE[t.stage] || t.stage)} · ${esc(t.who)}</span>
            <span class="md" style="font-size:var(--fs-body);line-height:1.62;color:var(--text-2)">${prose(t.text)}</span>
          </div>`).join("") || `<div class="d-tr"><span class="d-lbl">not handed on yet</span></div>`}</div>
        ${detail.tasks.some(inFlight) ? `<div style="margin-top:24px">${rule("in flight")}
          <div class="d-list">${detail.tasks.filter(inFlight).map((t) => `<div class="d-tr" style="grid-template-columns:132px minmax(0,1fr);align-items:start;min-height:auto;padding:12px 4px">
            <span class="d-m" style="font-size:12px;color:${WARN}">${esc(t.agent || "agent")} · ${ago(t.progressAt)}</span>
            <span class="md" style="font-size:var(--fs-body);line-height:1.62;color:var(--text-2)">${prose(t.progress)}</span></div>`).join("")}</div></div>` : ""}
        ${detail.needsReply ? `<div class="d-hint" style="color:${ERR}">every task is finished and no answer has been written — <span class="d-m">pilo reply ${esc(detail.id)} "…"</span></div>` : ""}
        <div style="display:flex;gap:8px;margin-top:24px">
          ${btn("Ask a follow-up", "follow-request", `data-id="${detail.id}"`)}
          ${btn("See the events", "go-events", "", "gn-btn-ghost")}
        </div></div>`
    : `<div style="min-width:0"><div class="d-lblrule"><span class="d-lbl">${T("desk.lbl.handling")}</span></div>
        <div style="padding:48px 4px;font-size:var(--fs-body);color:var(--text-3)">Pick a request on the left.</div></div>`;

  return `<div class="d-pad d-fill">` +
    pageHead(T("desk.title.inbox"), `${all.length} in all`,
      seg([["Open", "Open"], ["Closed", "Closed"], ["All", "All"]], state.reqFilter, "req-filter")) +
    `<div class="d-split"><div class="d-reqcol">
      <div class="d-lblrule"><span class="d-lbl">${T("desk.lbl.byAgent")}</span>
        <span class="d-m" style="margin-left:auto;font-size:11px;color:var(--text-3)">${rows.length} / ${byState.length}</span></div>
      <div class="d-list d-byagent">${agentOpts}</div>
      <div class="d-reqsec">
        <div class="d-lblrule"><span class="d-lbl">${T("desk.lbl.requests")}</span>
          <span class="d-m" style="margin-left:auto;font-size:11px;color:var(--text-3)">${esc(state.reqAgent || "every agent")}</span></div>
        <div class="d-reqlist"><div class="d-list">${reqRows}</div>
        ${rows.length ? "" : `<div style="padding:48px 4px;text-align:center"><div class="d-lbl">${T("desk.lbl.nothingHere")}</div>
          <div style="margin-top:16px">${btn(T("desk.lbl.clearFilter"), "clear-req-filter")}</div></div>`}</div>
      </div></div><div class="d-handling">${handling}</div></div></div>`;
};

// ---------- SCHEDULES ----------
views.schedules = () => {
  const list = state.data.schedules || [];
  // 09.10 09:00 — the columns are narrow and a locale string wraps in them.
  const when = (iso) => {
    if (!iso) return "—";
    const d = new Date(iso);
    return `${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")} ${hhmm(iso)}`;
  };
  const runs = state.data.recentRuns || [];
  return page(
    pageHead(T("desk.title.schedules"), `${list.filter((s) => s.enabled).length} of ${list.length} on`, btn(T("desk.act.newSchedule"), "new-schedule")) +
    `<div class="d-list">
      <div class="d-th" style="grid-template-columns:minmax(0,1fr) 96px 232px 116px 116px 52px">
        <span class="d-lbl">name</span><span class="d-lbl">to</span><span class="d-lbl">when</span><span class="d-lbl">next run</span><span class="d-lbl">last run</span><span class="d-lbl d-num">on</span>
      </div>
      ${list.length ? list.map((s) => `<button class="d-plain d-tr d-rowbtn" style="grid-template-columns:minmax(0,1fr) 96px 232px 116px 116px 52px" data-act="open-schedule" data-id="${s.id}">
        <span class="d-clip" style="font-size:var(--fs-body);color:${s.enabled ? "var(--text)" : "var(--text-3)"}">${esc(s.name)}</span>
        <span class="d-m d-clip" style="font-size:12px;color:var(--text-2)">${esc(s.agent)}</span>
        <span class="d-m d-clip" style="font-size:12px;color:var(--text-2)">${esc(s.cadence)}${s.weekdaysOnly ? " · weekdays" : ""}${s.onMiss === "skip" ? " · skip if missed" : ""}</span>
        <span class="d-m" style="font-size:12px;color:${s.enabled ? ACCT : "var(--text-3)"}">${esc(s.enabled ? when(s.nextRunAt) : "off")}</span>
        <span class="d-m" style="font-size:12px;color:${s.failCount ? ERR : "var(--text-3)"}">${esc(when(s.lastRunAt))}</span>
        <span class="d-num"><span class="d-dot" style="background:${s.enabled ? OK : DIM};margin-left:auto"></span></span>
      </button>`).join("") : `<div class="d-tr"><span class="d-lbl">nothing standing yet</span></div>`}
    </div>
    <div style="margin-top:48px">
      <div class="d-lblrule"><span class="d-lbl">${T("desk.lbl.recentRuns")}</span>
        <span class="d-m" style="margin-left:auto;font-size:11px;color:var(--text-3)">${runs.length}</span></div>
      <div class="d-list">${runs.length ? runs.map((r) => `<div class="d-tr" style="grid-template-columns:132px minmax(0,1fr) minmax(0,200px) 88px">
        <span class="d-m" style="font-size:12px;color:var(--text-3)">${when(r.firedAt)}</span>
        <span class="d-clip" style="font-size:var(--fs-small)">${esc(r.schedule)}</span>
        <span class="d-m d-clip" style="font-size:12px;color:${r.taskStatus === "failed" ? ERR : r.taskStatus === "done" ? OK : WARN}">${esc(r.error || r.taskStatus || (r.reply ? "answered" : "in flight"))}</span>
        <span class="d-m d-num" style="font-size:12px;color:var(--text-3)">${r.taskId ? `task ${r.taskId}` : `in-${r.inboxId}`}</span>
      </div>`).join("") : `<div class="d-tr"><span class="d-lbl">nothing has run yet</span></div>`}</div>
    </div>`
  );
};

// ---------- EVENTS ----------
const EVENT_FILTERS = [["all", "all"], ["wake", "wake"], ["task", "task"], ["report", "report"], ["answer", "answer"], ["failure", "failure"]];
const evGroup = (type) => (/wake/.test(type) ? "wake" : /fail/.test(type) ? "failure" : type === "final_reply" ? "answer" : type === "pm_result" ? "report" : /task|progress|blocked|answered|stall/.test(type) ? "task" : "");
const evCol = (type) => (/fail/.test(type) ? ERR : type === "final_reply" ? ACCT : type === "pm_result" ? INFO : /progress|stall/.test(type) ? WARN : "var(--text-3)");

views.events = () => {
  const all = state.data.events || [];
  const rows = all.filter((e) => state.eventFilter === "all" || evGroup(e.type) === state.eventFilter);
  return page(
    pageHead(T("desk.title.events"), `${all.length} kept`, seg(EVENT_FILTERS, state.eventFilter, "ev-filter")) +
    `<div class="d-lblrule"><span class="d-lbl">${T("desk.lbl.eventLog")}</span>
      <span class="d-m" style="margin-left:auto;font-size:11px;color:var(--text-3)">${rows.length} / ${all.length}</span></div>
    <div class="d-list">${rows.map((e) => `<button class="d-plain d-tr d-rowbtn" style="grid-template-columns:72px 110px minmax(0,1fr) minmax(0,140px)" data-act="open-event" data-id="${e.id}">
      <span class="d-m" style="font-size:12px;color:var(--text-3)">${hhmm(e.createdAt)}</span>
      <span class="d-m d-clip" style="font-size:12px;color:${evCol(e.type)}">${esc(e.type)}</span>
      <span class="d-clip" style="font-size:var(--fs-body)">${esc(e.title)}</span>
      <span class="d-m d-clip" style="font-size:12px;color:var(--text-3)">${esc(e.agent)}</span>
    </button>`).join("")}</div>
    ${rows.length ? "" : `<div style="padding:48px 4px;text-align:center"><div class="d-lbl">${T("desk.lbl.nothingHere")}</div>
      <div style="margin-top:16px">${btn(T("desk.lbl.clearFilter"), "ev-filter", 'data-value="all"')}</div></div>`}
    <div class="d-hint">A click opens the event with its full payload.</div>`
  );
};

// ---------- ARTIFACTS ----------
const splitDelta = (delta) => {
  const m = String(delta || "").match(/\+(\d+)/), n = String(delta || "").match(/[−-](\d+)/);
  return [m ? `+${m[1]}` : "", n ? `−${n[1]}` : ""];
};

views.artifacts = () => {
  const list = state.data.artifacts || [];
  return page(
    pageHead(T("desk.title.artifacts"), `${list.length} files changed`,
      `<label class="gn-switch" style="opacity:.5" title="pilo does not record who owns a file">
        <input type="checkbox" disabled><span class="gn-switch-track"><span class="gn-switch-knob"></span></span><span>Only mine</span></label>`) +
    `<div class="d-lblrule"><span class="d-lbl">${T("desk.lbl.files")}</span></div>
    <div class="d-list">${list.length ? list.map((f) => {
      const [add, del] = splitDelta(f.delta);
      return `<button class="d-plain d-tr d-rowbtn" style="grid-template-columns:minmax(0,1fr) 64px 56px 120px 72px" data-act="open-artifact" data-id="${f.id}">
        <span class="d-m d-clip" style="font-size:var(--fs-body)">${esc(f.path)}</span>
        <span class="d-m d-num" style="font-size:12px;color:var(--ok)">${esc(add)}</span>
        <span class="d-m d-num" style="font-size:12px;color:var(--err)">${esc(del)}</span>
        <span class="d-m d-clip" style="font-size:12px;color:var(--text-2)">${esc(f.agent)}</span>
        <span class="d-m d-num" style="font-size:12px;color:var(--text-3)">${hhmm(f.createdAt)}</span>
      </button>`;
    }).join("") : `<div class="d-tr"><span class="d-lbl">no files yet — they arrive with an agent's report</span></div>`}</div>
    <div class="d-hint">A click opens the diff in a wide dialog. "Only mine" is switched off: nothing in pilo records who owns a file.</div>`
  );
};

// ---------- PROJECTS ----------
views.projects = () => {
  const list = state.data.projects || [];
  const rows = treeRows();
  return page(
    pageHead(T("desk.title.projects"), `${list.length}`, btn(T("desk.act.newProject"), "new-project")) +
    `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px">
      ${list.length ? list.map((p) => {
        const here = rows.filter(({ a }) => String(a.projectId) === String(p.id));
        // The card's ladder starts at its own top, not at the whole tree's.
        const base = Math.min(...here.map((r) => r.lvl), 0);
        const shown = here.slice(0, 3);
        return `<button class="d-plain" style="display:flex;flex-direction:column;gap:16px;border:var(--bw) solid var(--line);padding:20px;cursor:pointer;min-height:208px" data-act="open-project" data-id="${p.id}">
          <span style="display:flex;align-items:baseline;gap:12px;width:100%">
            <span class="d-clip" style="font-size:var(--fs-h2);letter-spacing:-0.02em;flex:1">${esc(p.name)}</span>
            <span class="d-m" style="font-size:11px;letter-spacing:0.08em;color:var(--accent-text);flex:none">open</span></span>
          <span class="d-m d-clip" style="display:block;width:100%;font-size:var(--fs-small);color:var(--text-3)">${esc(p.path || p.repo || "no folder")}</span>
          <span style="display:block;width:100%" class="gn-ladder gn-ladder-compact gn-ladder-bar">
            ${shown.map(({ a, lvl }) => {
              const role = a.role.toUpperCase();
              return `<span class="gn-ladder-row" style="display:flex">
                <span class="gn-ladder-indent" data-level="${Math.min(lvl - base, 2)}"></span>
                <span class="gn-ladder-block" data-role="${role.toLowerCase()}">
                  <span class="gn-ladder-plate" data-role="${role.toLowerCase()}">${role}</span>

            ${p.pm ? "" : `<span class="d-ghostrow">nobody looks after this</span>`}
            ${here.length > 3 ? `<span class="d-m" style="display:block;padding:4px 0 0 32px;font-size:11px;color:var(--text-3)">+${here.length - 3} more</span>` : ""}

};

/* ---------- dialog ---------- */
// The design replaced every list+detail pane with one dialog: a head, a body
// built out of five blocks (banner · fields · prose · trace · code) and a foot
// of actions. Everything the old right-hand column could do lives in here.
const DIALOGS = {};

// ⌘K. The rows are the screens and the CLI catalogue; what you type is not
// sent from here — it lands in the composer, where you can still read it.
function paletteHtml() {
  if (!state.palette) return "";
  const q = (state.palQuery || "").trim().toLowerCase();
  const rows = [
    ...RAIL.map(([key]) => [`:${key}`, T(`desk.rail.${key}`), () => `go-screen" data-value="${key}`]),
    ...CLI_COMMANDS.map((c) => [`pilo ${c.name}`, c.summary, null])
  ].filter(([c, d]) => !q || `${c} ${d}`.toLowerCase().includes(q)).slice(0, 8);
  return `<div class="d-scrim" data-act="close-palette">
    <div class="d-dlg" data-keep="1">
      <div style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:var(--bw) solid var(--line)">
        <span class="d-m" style="color:var(--accent-text)">❯</span>
        <input class="gn-input" id="palq" style="border:none;background:transparent;padding:0" placeholder="Type a command or a request" value="${esc(state.palQuery || "")}">
        <span class="gn-kbd" style="flex:none">esc</span>
      </div>
      <div class="d-dlgbody" style="padding:8px 0">
        ${rows.map(([c, d, go]) => `<button class="d-plain d-rowbtn" style="display:flex;align-items:center;gap:16px;width:100%;min-height:40px;padding:0 20px"
          ${go ? `data-act="${go()}"` : `data-act="pal-copy" data-value="${esc(c)}"`}>
          <span class="d-m" style="font-size:var(--fs-small);color:var(--accent-text);width:120px;flex:none">${esc(c)}</span>
          <span class="d-clip" style="font-size:var(--fs-small);color:var(--text-2);flex:1">${esc(d)}</span>
        </button>`).join("")}
        ${q ? `<button class="d-plain d-rowbtn" style="display:flex;align-items:center;gap:16px;width:100%;min-height:40px;padding:0 20px" data-act="pal-send">
          <span class="d-m" style="font-size:var(--fs-small);color:var(--accent-text);width:120px;flex:none">ask</span>
          <span class="d-clip" style="font-size:var(--fs-small);flex:1">${esc(state.palQuery)}</span></button>` : ""}
      </div></div></div>`;
}

function dialogHtml() {
  const d = state.dlg;
  if (!d) return "";
  const make = DIALOGS[d.kind];
  const dlg = make ? make(d) : { title: d.kind, sub: "" };
  const fields = (dlg.fields || []).filter(Boolean);
  return `<div class="d-scrim" data-act="close-dialog">
    <div class="d-dlg${dlg.wide ? " d-dlg-wide" : ""}" data-keep="1">
      <div class="d-dlghead">
        <div style="min-width:0">
          <div class="d-clip" style="font-size:var(--fs-h2);letter-spacing:-0.02em">${dlg.title}</div>
          <div class="d-m d-clip" style="margin-top:6px;font-size:12px;color:var(--text-3)">${dlg.sub || ""}</div>
        </div>
        <button class="d-plain d-m" style="margin-left:auto;font-size:15px;color:var(--text-3);flex:none" data-act="close-dialog" title="close">×</button>
      </div>
      <div class="d-dlgbody">
        ${dlg.banner ? bannerHtml(dlg.banner) : ""}
        ${fields.length ? `<div style="display:flex;flex-direction:column">${fields.map(fieldHtml).join("")}</div>` : ""}
        ${dlg.prose ? `<div style="max-width:var(--measure);font-size:var(--fs-body);line-height:1.62;white-space:pre-wrap">${dlg.prose}</div>` : ""}
        ${dlg.trace ? traceHtml(dlg.traceLabel || "", dlg.trace) : ""}
        ${dlg.code ? codeHtml(dlg.code) : ""}
      </div>
      ${dlg.actions ? `<div class="d-dlgfoot">${dlg.actions.filter(Boolean).join("")}</div>` : ""}
    </div></div>`;
}

const bannerHtml = (b) => `<div style="display:flex;align-items:flex-start;gap:12px;padding:16px;margin-bottom:24px;background:var(--bg-2);border-left:3px solid ${b.color}">
  <span class="d-m" style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:${b.color};flex:none">${esc(b.label)}</span>
  <span style="font-size:var(--fs-small);line-height:1.6;color:var(--text-2);flex:1">${esc(b.text)}</span>
  ${b.action || ""}</div>`;

function fieldHtml(f) {
  const body = f.kind === "textarea"
    ? `<textarea class="gn-input" id="${f.id}" rows="3" style="height:auto;resize:vertical">${esc(f.value || "")}</textarea>`
    : f.kind === "select"
      ? `<select class="gn-select gn-input-sm" id="${f.id}" style="justify-self:start;min-width:180px">${(f.options || []).map(([v, label]) =>
          `<option value="${esc(v)}" ${String(f.value) === String(v) ? "selected" : ""}>${esc(label)}</option>`).join("")}</select>`
      : f.kind === "seg"
        ? `<span class="d-seg" style="justify-self:start">${(f.options || []).map(([v, label, lock]) =>
            `<button class="d-segopt" aria-selected="${String(f.value) === String(v)}" aria-disabled="${Boolean(lock)}" data-act="${f.act}" data-value="${esc(v)}">${esc(label)}</button>`).join("")}</span>`
        : f.kind === "read"
          ? `<span style="display:flex;align-items:center;gap:9px;min-width:0">${f.mark || ""}<span class="d-m d-clip" style="font-size:var(--fs-small)">${esc(f.value || "")}</span></span>`
          : f.kind === "note"
            ? `<span class="d-m" style="justify-self:start;align-self:center;font-size:13px;color:var(--accent-text)">${esc(f.value || "")}</span>`
            : f.kind === "switch"
              ? `<label class="gn-switch" style="justify-self:start"><input type="checkbox" id="${f.id}" ${f.value ? "checked" : ""}><span class="gn-switch-track"><span class="gn-switch-knob"></span></span></label>`
              : `<input class="gn-input gn-input-sm gn-input-mono" id="${f.id}" value="${esc(f.value || "")}" placeholder="${esc(f.place || "")}">`;
  return `<div style="display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center;padding:12px 0;border-bottom:var(--hairline) solid var(--line-soft)">
    <span class="d-lbl">${esc(f.label)}</span>${body}
    ${f.hint ? `<span style="grid-column:2;font-size:var(--fs-small);line-height:1.5;color:var(--text-3)">${esc(f.hint)}</span>` : ""}</div>`;
}

const traceHtml = (label, rows) => `<div style="margin-top:24px">
  <div class="d-lbl">${esc(label)}</div>
  <div style="margin-top:12px">${rows.length ? rows.map(([k, v, color, action]) => `<div style="display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:var(--hairline) solid var(--line-soft)">
    <span class="d-m" style="font-size:12px;color:${color || DIM};width:96px;flex:none">${esc(k)}</span>
    <span style="font-size:var(--fs-small);line-height:1.6;color:var(--text-2);min-width:0;white-space:pre-wrap;flex:1">${esc(v)}</span>
    ${action ? `<span style="flex:none">${action}</span>` : ""}
  </div>`).join("") : `<div class="d-lbl" style="padding:12px 0">nothing yet</div>`}</div></div>`;

// A diff keeps its gutter and its tint; a payload is the same block with the
// marks left blank.
function codeHtml(text) {
  const lines = String(text || "").split("\n");
  return `<div style="border:var(--bw) solid var(--line);background:var(--bg);padding:12px 0;overflow-x:auto">${lines.map((line) => {
    const c = line[0];
    const add = c === "+", del = c === "-", hunk = line.startsWith("@@");
    const bar = add ? OK : del ? ERR : "transparent";
    return `<div style="display:flex;gap:12px;padding:0 16px;background:${add ? "var(--ok-weak)" : del ? "var(--err-weak)" : "transparent"};border-left:3px solid ${bar}">
      <span class="d-m" style="font-size:12px;color:${add ? OK : del ? ERR : DIM};width:10px;flex:none">${add ? "+" : del ? "−" : ""}</span>
      <span class="d-m" style="font-size:12px;line-height:1.9;white-space:pre;color:${hunk ? DIM : add ? "var(--text)" : "var(--text-2)"}">${esc(add || del ? line.slice(1) : line)}</span>
    </div>`;
  }).join("")}</div>`;
}

DIALOGS.rules = () => {
  const r = state.rules;
  const agents = allAgents();
  // Every agent that can take rules gets its own button, and one button sends to
  // all of them. The ones left out say why, instead of simply not being there.
  const eligible = agents.filter((a) => a.role !== "system" && a.cwd);
  const seen = new Set(agents.map((a) => String(a.id)));
  const system = (state.data.agents || []).filter((a) => a.role === "system" && !seen.has(String(a.id)));
  const left = [
    ...agents.filter((a) => a.role !== "system" && !a.cwd).map((a) => [a.name, `${a.role} · no folder, so there is no file to write into`, DIM]),
    ...agents.filter((a) => a.role === "system").concat(system).map((a) => [a.name, "system · Pilo's own errand runner — takes no instructions", DIM])
  ];
  if (!r) return {
    title: "Rules",
    sub: `each agent carries its own file · ${eligible.length} can take rules`,
    prose: "Pilo has no one list of rules yet: each agent's instructions live in the CLAUDE.md or AGENTS.md next to its own work. Open one to read and re-send it, or send the current rules to all of them.",
    trace: [
      ...eligible.map((a) => [a.name, `${a.role} · ${a.cwd}`, roleFg(a.role.toUpperCase()), btn("open", "rules", `data-id="${a.id}"`, "gn-btn-ghost")]),
      ...left
    ],
    traceLabel: `agents · ${eligible.length}${left.length ? ` · ${left.length} left out` : ""}`,
    actions: [
      btn(T("desk.act.cancel"), "close-dialog", "", "gn-btn-ghost"),
      right(`Send to all ${eligible.length}`, "write-rules-all", "", "gn-btn-brand")
    ]
  };
  return {
    wide: true,
    title: `Rules — ${esc(r.agent.name)}`,
    sub: `${esc(r.file)} · ${r.exists ? (r.hasBlock ? "replaces the pilo block" : "appends to the file") : "creates the file"}`,
    code: r.preview,
    actions: [
      btn("Pick another", "resend-rules", "", "gn-btn-ghost"),
      right(r.exists && r.hasBlock ? "Update and tell the session" : "Write and tell the session", "write-rules", `data-id="${r.agent.id}"`, "gn-btn-brand")
    ]
  };
};

const actions = {
  async "open-palette"() { state.palette = true; state.palQuery = ""; render(); },
  async "close-palette"() { state.palette = false; state.palQuery = ""; render(); },
  async "go-screen"(el) { state.palette = false; state.palQuery = ""; state.tab = el.dataset.value; location.hash = state.tab; render(); await loadDetail(); render(); },
  async "pal-copy"(el) { await navigator.clipboard.writeText(el.dataset.value); state.palette = false; toast(`${el.dataset.value} copied`); render(); },
  // Typing here never sends: the line goes into the composer so you read it once more.
  async "pal-send"() { state.draft = state.palQuery; state.palette = false; state.palQuery = ""; state.tab = "work"; location.hash = "work"; render(); },
  async "go-agents"() { state.tab = "agents"; location.hash = "agents"; render(); },
  async "go-events"() { state.tab = "events"; location.hash = "events"; render(); },
  async "close-dialog"() { state.dlg = null; state.rules = null; render(); },
  async "open-agent"(el) { state.dlg = { kind: "agent", id: el.dataset.id }; render(); },
  // role empty on purpose: the dialog derives it from the project until you pick.
  async "add-agent"() { state.form = { ...emptyForm(), role: "" }; state.dlg = { kind: "add-agent" }; render(); },
  async "resend-rules"() { state.rules = null; state.dlg = { kind: "rules" }; render(); },
  async "dlg-role"(el) { state.dlg = { ...state.dlg, role: el.dataset.value }; render(); },
  async "form-role"(el) { keepDialogForm(); state.form.role = el.dataset.value; render(); },
  async "save-agent"(el) {
    const val = (id) => ($(id) ? $(id).value.trim() : undefined);
    await call("PATCH", `/api/agents/${el.dataset.id}`, {
      name: val("d-name"), role: state.dlg.role, projectId: $("d-project") ? $("d-project").value || null : undefined,

    });
    state.dlg = null;
    toast("saved");
    await load();
  },
  async "open-schedule"(el) { state.schedule = { ...state.schedule, onMiss: null }; state.dlg = { kind: "schedule", id: el.dataset.id }; state.runs = { open: el.dataset.id, rows: await get(`/api/schedules/${el.dataset.id}/runs`) }; render(); },
  async "new-schedule"() { state.dlg = { kind: "new-schedule" }; render(); },
  async "sched-miss"(el) { state.schedule = { ...state.schedule, onMiss: el.dataset.value }; render(); },
  async "save-schedule"(el) {
    await call("POST", `/api/schedules/${el.dataset.id}`, readScheduleForm());
    state.dlg = null;
    toast("saved");
    await load();
  },
  // The prompt goes into the composer rather than firing straight off: a
  // standing instruction sent by accident is a real request to a real agent.
  async "run-schedule"(el) {
    const s = (state.data.schedules || []).find((x) => String(x.id) === String(el.dataset.id));
    state.dlg = null;

  async "open-event"(el) {
    state.selected.event = el.dataset.id;
    state.data.eventDetail = await get(`/api/events/${el.dataset.id}`);
    state.dlg = { kind: "event", id: el.dataset.id };
    render();

    state.selected.artifact = el.dataset.id;
    state.data.artifactDetail = await get(`/api/artifacts/${el.dataset.id}`);
    state.dlg = { kind: "artifact", id: el.dataset.id };
    render();
  },
  async "open-project"(el) { state.dlg = { kind: "project", id: el.dataset.id }; render(); },
  async "new-project"() { state.project = { id: null, name: "", repo: "", path: "", note: "" }; state.dlg = { kind: "new-project" }; render(); },
  async "save-project"(el) {
    await call("PATCH", `/api/projects/${el.dataset.id}`, readProjectForm());
    state.dlg = null;
    toast("saved");
    await load();

  async "ask-project"(el) {

    state.dlg = null;
    state.draft = state.draft || `${p?.name || ""} — `;

  async "req-agent"(el) { state.reqAgent = el.dataset.name || ""; render(); },
  async "clear-req-filter"() { state.reqFilter = "All"; state.reqAgent = ""; render(); },
  async "ev-filter"(el) { state.eventFilter = el.dataset.value; render(); },
  async "follow-request"(el) {
    const detail = state.data.inboxDetail;
    state.tab = "work";
    location.hash = "work";
    state.selected.inbox = el.dataset.id;
    state.draft = state.draft || "";
    render();

  async "toggle-conv"(el) {
    const key = String(el.dataset.id);
    const f = state.feed;
    const at = f.rows.findIndex((row) => String(row.id) === key);
    if (folded(key, at)) { f.open.add(key); f.shut.delete(key); }
    else { f.shut.add(key); f.open.delete(key); }
    render();
    await loadOpenDetails();
    render();
  },
  async "pick-agent"(el) {
    const f = state.feed;
    const name = el.dataset.name || "";
    f.agent = f.agent === name ? "" : name;
    f.rows = [];
    f.done = false;
    f.detail = {};
    state.tab = "work";
    location.hash = "work";
    if (!f.agent) refreshFeed();
    render();
    await loadDetail();
    render();
  },
  async "clear-feed-filter"() {
    const f = state.feed;
    f.agent = "";
    f.rows = [];
    f.done = false;
    refreshFeed();
    render();
    await loadDetail();
    render();
  },
  async "to-end"() {
    const feed = feedNode();
    if (feed) toEnd(feed);
    pinned = true;
    unseen = 0;
    showUnseen();
  },
  async "set-theme"(el) { setTheme(el.dataset.value); render(); },
  async "set-lang"(el) { setLang(el.dataset.value); render(); },
  async "rules"(el) {
    state.rules = await get(`/api/agents/${el.dataset.id}/rules`);
    state.dlg = { kind: "rules" };
    render();
  },
  async "write-rules-all"() {
    const targets = allAgents().filter((a) => a.role !== "system" && a.cwd);
    toast(`규칙 ${targets.length}개 보내는 중…`);
    const failed = [];
    for (const a of targets) {
      try {
        await call("POST", `/api/agents/${a.id}/rules`, {});
      } catch (err) {
        failed.push(a.name);
      }
    }
    toast(failed.length
      ? `규칙 ${targets.length - failed.length}/${targets.length} 보냄 · 실패: ${failed.join(", ")}`
      : `규칙 ${targets.length}개 모두 보냄 · 각 세션에 반영 요청`, failed.length > 0);
  },
  async "fold-agent"(el) {
    state.fold = { ...state.fold, [el.dataset.name]: !state.fold[el.dataset.name] };
    render();
  },
  async "write-rules"(el) {
    const res = await call("POST", `/api/agents/${el.dataset.id}/rules`, {});
    toast(
      `${res.updated ? "갱신" : "생성"}: ${res.file.split("/").pop()}` +
        (res.notified ? " · 세션에 반영 요청 보냄" : ` · 세션 알림 실패 (${res.reason})`),
      !res.notified
    );
    state.rules = await get(`/api/agents/${el.dataset.id}/rules`);
    render();
  },
  async "create-agent"() {
    keepDialogForm();
    const f = state.form;
    const sessions = state.data.sessions || [];
    const chosen = sessions.find((x) => x.target === f.target) || sessions.find((x) => !x.boundAgent);
    const pms = state.data.tree?.pms || [];
    const pmHere = pms.find((p) => String(p.projectId) === String(f.projectId));
    const role = f.role || (pmHere ? "worker" : "pm");
    const pilo = state.data.tree?.pilo;
    const parentAgentId = role === "worker" ? (pmHere?.id || pilo?.id || "") : pilo?.id || "";
    const form = {
      name: f.name || chosen?.suggestedName || "",
      role,
      parentAgentId: parentAgentId || null,
      projectId: f.projectId || null,
      cwd: f.cwd || chosen?.cwd || "",
      specialty: f.specialty || "",
      aliases: "", note: "", model: "",
      writeRules: f.writeRules !== false
    };
    if (!form.name || !form.cwd) return toast("a name and a folder are needed", true);
    const res = await call("POST", "/api/agents", form);
    state.form = emptyForm();
    state.dlg = null;
    if (res.target) toast(`${form.name} · ${role} · ${res.target}`);
    else toast(`${form.name} registered — no session matched ${form.cwd}`, true);
    await load();
  },
  async "delete-agent"(el) {
    if (!confirm("이 agent를 삭제할까요? 과거 기록은 그대로 남습니다.")) return;
    await call("DELETE", `/api/agents/${el.dataset.id}`);
    state.dlg = null;
    toast("agent removed — its record stays");
    await load();
  },
  async "rebind"(el) {
    const res = await call("POST", `/api/agents/${el.dataset.id}/rebind`, {});
    state.candidates = res.candidates || [];
    state.editing = state.editing || el.dataset.id;
    toast(res.target ? `세션 재바인딩: ${res.target}` : `후보 ${state.candidates.length}개 — 하나를 고르세요`, !res.target);
    await load();
  },
  async "wake"(el) {
    try {
      await call("POST", `/api/agents/${el.dataset.id}/wake`, {});
      toast("wake 신호를 보냈습니다");
    } catch (err) {
      toast(`wake 실패: ${err.message}`, true);
    }
    await load();
  },
  async "dismiss-wake"(el) {
    await call("POST", `/api/agents/${el.dataset.id}/dismiss-wake`, {});
    toast("확인 처리됨 — 기록은 Events에 남습니다");
    await load();
  },
  async "open-inbox"(el) {
    state.selected.inbox = el.dataset.id;
    state.data.inboxDetail = await get(`/api/inbox/${el.dataset.id}`);
    render();
  },

  async "copy-json"() {
    await navigator.clipboard.writeText(JSON.stringify(state.data.eventDetail?.payload ?? {}, null, 2));
    toast("payload copied");
  },
  async "copy-diff"() {
    await navigator.clipboard.writeText(state.data.artifactDetail?.diff || "");
    toast("diff copied");
  },
  async "create-project"() {
    const form = readProjectForm();
    if (!form.name) return toast("a name is needed", true);
    await call("POST", "/api/projects", form);
    state.project = { id: null, name: "", repo: "", path: "", note: "" };
    state.dlg = null;
    toast("project created");
    await load();
  },
  async "create-schedule"() {
    const form = readScheduleForm();
    if (!form.name || !form.request || !form.toAgentId) return toast("a name, a target and a prompt are needed", true);
    await call("POST", "/api/schedules", form);
    state.schedule = { name: "", toAgentId: "", request: "", cadence: "09:00", weekdaysOnly: true, onMiss: "run" };
    state.dlg = null;
    toast("scheduled");
    await load();
  },
  async "toggle-schedule"(el) {
    const on = el.dataset.on === "1";
    await call("POST", `/api/schedules/${el.dataset.id}`, { enabled: on });
    state.dlg = null;
    toast(on ? "예약을 켰습니다" : "예약을 껐습니다 — 켜기 전까지 돌지 않습니다");
    await load();
  },
  async "delete-schedule"(el) {
    if (!confirm("이 예약을 삭제할까요? 지난 실행 기록은 그대로 남습니다.")) return;
    await call("DELETE", `/api/schedules/${el.dataset.id}`);
    state.dlg = null;
    toast("schedule removed — past runs stay");
    await load();
  },
  async "delete-project"(el) {
    if (!confirm("이 프로젝트를 삭제할까요?")) return;
    await call("DELETE", `/api/projects/${el.dataset.id}`);
    state.dlg = null;
    toast("project removed");
    await load();
  },
  async "toggle-rule"(el) {
    const rules = state.data.settings.notifications.map((r, i) => (i === Number(el.dataset.key) ? { ...r, on: !r.on } : r));
    await call("PUT", "/api/settings/notifications", { value: rules });
    toast("알림 규칙 저장됨");
    await load();
  },
  async "toggle-token"(el) {
    const tokens = { ...state.data.settings.tokens };
    tokens[el.dataset.key] = tokens[el.dataset.key] === false;
    await call("PUT", "/api/settings/tokens", { value: tokens });
    toast("토큰 표시 설정 저장됨");
    await load();
  },
  async "retention"(el) {
    const retention = { ...state.data.settings.retention, [el.dataset.key]: Number(el.dataset.days) };
    await call("PUT", "/api/settings/retention", { value: retention });
    toast("보관 기간 저장됨 (삭제는 2차)");
    await load();
  }
};

function wire() {
  document.querySelectorAll("[data-tab]").forEach((el) => {
    el.onclick = async () => {
      state.tab = el.dataset.tab;
      location.hash = state.tab;
      render();
      await loadDetail();
      render();
    };
  });
  $("dlg")?.querySelectorAll("[data-keep]").forEach((node) => { node.onclick = (event) => event.stopPropagation(); });
  const box = $("palq");
  if (box) {
    box.focus();
    box.selectionStart = box.value.length;
    box.oninput = () => { state.palQuery = box.value; render(); };
  }
  // A foldable row is a button to the keyboard too.
  document.querySelectorAll('[data-fold="on"]').forEach((el) => {
    el.onkeydown = (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      el.click();
    };
  });
  document.querySelectorAll("[data-act]").forEach((el) => {
    el.onclick = async (event) => {
      event.stopPropagation();
      const run = actions[el.dataset.act];
      if (!run) return;
      try {
        await run(el);
      } catch (err) {
        toast(err.message, true);
      }
    };
  });
}

window.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === "k") {
    event.preventDefault();
    state.palette = !state.palette;
    state.palQuery = "";
    render();
  }
  if (event.key === "Escape" && (state.palette || state.dlg)) {
    state.palette = false;
    state.dlg = null;
    render();
  }
});

window.addEventListener("hashchange", async () => {
  state.tab = location.hash.slice(1) || "work";
  render();
  await loadDetail();
  render();
});

try {
  setTheme(localStorage.getItem("pilo-theme") || "dark");
  setLang(localStorage.getItem("pilo-lang") || "en");
} catch (err) {
  setTheme("dark");
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

await load();
// Refreshing. The server says when something changed (/api/stream) and the page
// loads then. The clock is only a safety net: thirty seconds while the stream is
// up, the old five while it is not — an older server without the route, or a
// stream something in between refuses, still leaves a page that keeps up.
// Notices that arrive together, or while a load is running, become one more
// load, not one each.
const SAFETY_MS = 30000;
const FALLBACK_MS = 5000;
const GATHER_MS = 200;
const SILENT_MS = 60000; // the server pings every twenty
const sync = { live: false, loading: false, again: false, soon: null, lastLoad: Date.now(), heard: 0, stream: null };

async function refresh() {
  if (document.hidden) return; // coming back loads once, below
  if (sync.loading) {
    sync.again = true;
    return;
  }
  sync.loading = true;
  try {
    await load();
  } catch (err) {
    $("sync").textContent = "disconnected";
  } finally {
    sync.loading = false;
    sync.lastLoad = Date.now();
  }
  if (sync.again) {
    sync.again = false;
    refresh();
  }
}

function soon() {
  sync.heard = Date.now();
  if (sync.soon) return;
  sync.soon = setTimeout(() => {
    sync.soon = null;
    refresh();
  }, GATHER_MS);
}

async function listen() {
  if (!("EventSource" in window)) return;
  // A server from before the stream has no such route, and the browser would
  // log a refused stream every half minute until it is restarted. Its /health
  // does not count streams, so ask that first and keep to the clock meanwhile.
  const health = await fetch("/health").then((res) => res.json()).catch(() => null);
  if (!health || !("streams" in health)) {
    setTimeout(listen, SAFETY_MS);
    return;
  }
  const stream = new EventSource("/api/stream");
  sync.stream = stream;
  // Whatever changed while the connection was down arrives as this one load.
  stream.onopen = () => {
    sync.live = true;
    soon();
  };
  stream.onmessage = () => soon();
  stream.addEventListener("ping", () => { sync.heard = Date.now(); });
  stream.onerror = () => {
    sync.live = false;
    // A dropped connection is retried by the browser itself; a refused one is
    // closed for good, so ask again later.
    if (stream.readyState === EventSource.CLOSED && sync.stream === stream) setTimeout(listen, SAFETY_MS);
  };
}

setInterval(() => {
  if (document.hidden) return;
  if (sync.live && Date.now() - sync.heard > SILENT_MS) {
    sync.stream.close();
    sync.live = false;
    listen();
  }
  if (Date.now() - sync.lastLoad >= (sync.live ? SAFETY_MS : FALLBACK_MS)) refresh();
}, 1000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
});
listen();
</script>
</body>
