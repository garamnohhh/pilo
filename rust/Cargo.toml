[package]
name = "pilo"
version = "0.0.1"
edition = "2021"
description = "Pilo in one binary: the server, the CLI and the hooks (work in progress)"
license = "Apache-2.0"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde_json = "1"
regex = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time"] }

[profile.dev]
opt-level = 1
