<!doctype html><html lang="en"><head><meta charset="utf-8"><title>실제 것 옆의 시험용</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F4F6F4;color:#101413;font-family:'Geist', 'Noto Sans KR', sans-serif;padding:40px}
.eyebrow{font-family:'Geist Mono', 'Noto Sans KR', monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#6E7A72;margin:0 0 8px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:28px;margin:0 0 24px}
svg{max-width:960px;width:100%;height:auto}</style></head><body>
<p class="eyebrow">pilo</p><h1>실제 것 옆의 시험용</h1>
<svg viewBox="4 102 952 453" role="img" aria-labelledby="second-instance-light-title second-instance-light-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="second-instance-light-title">실제 것 옆의 시험용</title>
    <desc id="second-instance-light-desc">Two pilo instances side by side, each with its own home, data directory, port and socket, and a reminder to move the socket and spool together.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59635C"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B6B4A"/></marker>
    </defs>
    <rect x="4" y="102" width="952" height="453" fill="#F4F6F4"/>
    <rect x="100" y="130" width="340" height="64" rx="6" fill="#F4F6F4"/>
    <rect x="100" y="130" width="340" height="64" rx="6" fill="#FFFFFF" stroke="#101413" stroke-width="1"/>
    <rect x="108" y="138" width="60" height="12" rx="2" fill="none" stroke="#101413" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="138" y="147" fill="#101413" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANCE</text>
    <text x="270" y="158" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">실제로 쓰는 것</text>
    <text x="270" y="176" fill="#59635C" font-size="9" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle">매일 쓰는 쪽</text>
    <rect x="100" y="220" width="340" height="128" rx="6" fill="#E8EBE8" stroke="rgba(16,20,19,0.12)" stroke-width="1"/>
    <text x="116" y="244" fill="#59635C" font-size="10" font-family="'Geist Mono', 'Noto Sans KR', monospace">PILO_HOME  ~/.pilo</text>
    <text x="116" y="272" fill="#59635C" font-size="10" font-family="'Geist Mono', 'Noto Sans KR', monospace">PILO_DATA  ~/.pilo/data</text>
    <text x="116" y="300" fill="#59635C" font-size="10" font-family="'Geist Mono', 'Noto Sans KR', monospace">PILO_PORT  48888</text>
    <text x="116" y="328" fill="#59635C" font-size="10" font-family="'Geist Mono', 'Noto Sans KR', monospace">PILO_SOCKET  /tmp/pilo.sock</text>
    <line x1="270" y1="198" x2="270" y2="214" stroke="#59635C" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="520" y="130" width="340" height="64" rx="6" fill="#F4F6F4"/>
    <rect x="520" y="130" width="340" height="64" rx="6" fill="#DCF2E8" stroke="#0B6B4A" stroke-width="1"/>
    <rect x="528" y="138" width="60" height="12" rx="2" fill="none" stroke="#0B6B4A" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="558" y="147" fill="#0B6B4A" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANCE</text>
    <text x="690" y="158" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">시험용</text>
    <text x="690" y="176" fill="#59635C" font-size="9" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle">옆에서 돌고 아무것도 안 건드려요</text>
    <rect x="520" y="220" width="340" height="128" rx="6" fill="#E8EBE8" stroke="rgba(16,20,19,0.12)" stroke-width="1"/>
    <text x="536" y="244" fill="#59635C" font-size="10" font-family="'Geist Mono', 'Noto Sans KR', monospace">PILO_HOME  /tmp/try</text>
    <text x="536" y="272" fill="#59635C" font-size="10" font-family="'Geist Mono', 'Noto Sans KR', monospace">PILO_DATA  /tmp/try/data</text>
    <text x="536" y="300" fill="#59635C" font-size="10" font-family="'Geist Mono', 'Noto Sans KR', monospace">PILO_PORT  48999</text>
    <text x="536" y="328" fill="#59635C" font-size="10" font-family="'Geist Mono', 'Noto Sans KR', monospace">PILO_SOCKET  /tmp/try.sock</text>
    <line x1="690" y1="198" x2="690" y2="214" stroke="#59635C" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="270" y="400" width="420" height="70" rx="6" fill="#F4F6F4"/>
    <rect x="270" y="400" width="420" height="70" rx="6" fill="#DCF2E8" stroke="#0B6B4A" stroke-width="1"/>
    <rect x="278" y="408" width="66" height="12" rx="2" fill="none" stroke="#0B6B4A" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="311" y="417" fill="#0B6B4A" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle" letter-spacing="0.08em">WATCH OUT</text>
    <text x="480" y="431" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">소켓과 스풀은 같이 옮겨요</text>
    <text x="480" y="449" fill="#59635C" font-size="9" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle">CLI 가 둘 사이를 오가며 대체해요</text>
    <line x1="32" y1="504" x2="928" y2="504" stroke="rgba(16,20,19,0.12)" stroke-width="0.8"/>
    <text x="32" y="524" fill="#59635C" font-size="8" font-family="'Geist Mono', 'Noto Sans KR', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="132" y1="520" x2="160" y2="520" stroke="#0B6B4A" stroke-width="1.2"/>
    <text x="168" y="524" fill="#59635C" font-size="9" font-family="'Geist', 'Noto Sans KR', sans-serif">새로 띄우는 쪽</text>
    <line x1="376" y1="520" x2="404" y2="520" stroke="#59635C" stroke-width="1.2"/>
    <text x="412" y="524" fill="#59635C" font-size="9" font-family="'Geist', 'Noto Sans KR', sans-serif">건드리지 않는 쪽</text>
</svg>
</body></html>
