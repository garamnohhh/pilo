<!doctype html><html lang="en"><head><meta charset="utf-8"><title>A test instance beside a real one</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#08090A;color:#E6EBE6;font-family:'Geist', sans-serif;padding:40px}
.eyebrow{font-family:'Geist Mono', monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#6B776F;margin:0 0 8px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:28px;margin:0 0 24px}
svg{max-width:960px;width:100%;height:auto}</style></head><body>
<p class="eyebrow">pilo</p><h1>A test instance beside a real one</h1>
<svg viewBox="4 102 952 453" role="img" aria-labelledby="second-instance-dark-title second-instance-dark-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="second-instance-dark-title">A test instance beside a real one</title>
    <desc id="second-instance-dark-desc">Two pilo instances side by side, each with its own home, data directory, port and socket, and a reminder to move the socket and spool together.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8B968E"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3ED49C"/></marker>
    </defs>
    <rect x="4" y="102" width="952" height="453" fill="#08090A"/>
    <rect x="100" y="130" width="340" height="64" rx="6" fill="#08090A"/>
    <rect x="100" y="130" width="340" height="64" rx="6" fill="#0B0E0D" stroke="#E6EBE6" stroke-width="1"/>
    <rect x="108" y="138" width="60" height="12" rx="2" fill="none" stroke="#E6EBE6" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="138" y="147" fill="#E6EBE6" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANCE</text>
    <text x="270" y="158" fill="#E6EBE6" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the real one</text>
    <text x="270" y="176" fill="#8B968E" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">what you use every day</text>
    <rect x="100" y="220" width="340" height="128" rx="6" fill="#131917" stroke="rgba(230,235,230,0.12)" stroke-width="1"/>
    <text x="116" y="244" fill="#8B968E" font-size="10" font-family="'Geist Mono', monospace">PILO_HOME  ~/.pilo</text>
    <text x="116" y="272" fill="#8B968E" font-size="10" font-family="'Geist Mono', monospace">PILO_DATA  ~/.pilo/data</text>
    <text x="116" y="300" fill="#8B968E" font-size="10" font-family="'Geist Mono', monospace">PILO_PORT  48888</text>
    <text x="116" y="328" fill="#8B968E" font-size="10" font-family="'Geist Mono', monospace">PILO_SOCKET  /tmp/pilo.sock</text>
    <line x1="270" y1="198" x2="270" y2="214" stroke="#8B968E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="520" y="130" width="340" height="64" rx="6" fill="#08090A"/>
    <rect x="520" y="130" width="340" height="64" rx="6" fill="#12281F" stroke="#3ED49C" stroke-width="1"/>
    <rect x="528" y="138" width="60" height="12" rx="2" fill="none" stroke="#3ED49C" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="558" y="147" fill="#3ED49C" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANCE</text>
    <text x="690" y="158" fill="#E6EBE6" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a test one</text>
    <text x="690" y="176" fill="#8B968E" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">beside it, touching nothing</text>
    <rect x="520" y="220" width="340" height="128" rx="6" fill="#131917" stroke="rgba(230,235,230,0.12)" stroke-width="1"/>
    <text x="536" y="244" fill="#8B968E" font-size="10" font-family="'Geist Mono', monospace">PILO_HOME  /tmp/try</text>
    <text x="536" y="272" fill="#8B968E" font-size="10" font-family="'Geist Mono', monospace">PILO_DATA  /tmp/try/data</text>
    <text x="536" y="300" fill="#8B968E" font-size="10" font-family="'Geist Mono', monospace">PILO_PORT  48999</text>
    <text x="536" y="328" fill="#8B968E" font-size="10" font-family="'Geist Mono', monospace">PILO_SOCKET  /tmp/try.sock</text>
    <line x1="690" y1="198" x2="690" y2="214" stroke="#8B968E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="270" y="400" width="420" height="70" rx="6" fill="#08090A"/>
    <rect x="270" y="400" width="420" height="70" rx="6" fill="#12281F" stroke="#3ED49C" stroke-width="1"/>
    <rect x="278" y="408" width="66" height="12" rx="2" fill="none" stroke="#3ED49C" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="311" y="417" fill="#3ED49C" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WATCH OUT</text>
    <text x="480" y="431" fill="#E6EBE6" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">move the socket and the spool together</text>
    <text x="480" y="449" fill="#8B968E" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the CLI falls back from one to the other</text>
    <line x1="32" y1="504" x2="928" y2="504" stroke="rgba(230,235,230,0.12)" stroke-width="0.8"/>
    <text x="32" y="524" fill="#8B968E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="132" y1="520" x2="160" y2="520" stroke="#3ED49C" stroke-width="1.2"/>
    <text x="168" y="524" fill="#8B968E" font-size="9" font-family="'Geist', sans-serif">the one you are adding</text>
    <line x1="376" y1="520" x2="404" y2="520" stroke="#8B968E" stroke-width="1.2"/>
    <text x="412" y="524" fill="#8B968E" font-size="9" font-family="'Geist', sans-serif">left alone</text>
</svg>
</body></html>
