<!doctype html><html lang="en"><head><meta charset="utf-8"><title>What pilo keeps under ~/.pilo</title>

<p class="eyebrow">pilo</p><h1>What it keeps, and where</h1>

    <rect width="100%" height="100%" fill="#08090A"/>
    <rect x="80" y="140" width="220" height="64" rx="6" fill="#08090A"/>

    <text x="570" y="182" fill="#8B968E" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">settings</text>

    <rect x="420" y="300" width="300" height="56" rx="6" fill="#08090A"/>

    <text x="860" y="404" fill="#E6EBE6" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">127.0.0.1</text>
    <text x="860" y="422" fill="#8B968E" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the only socket</text>
