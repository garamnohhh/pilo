<!doctype html><html lang="en"><head><meta charset="utf-8"><title>A question waits, a note does not</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F4F6F4;color:#101413;font-family:'Geist', sans-serif;padding:40px}
.eyebrow{font-family:'Geist Mono', monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#6E7A72;margin:0 0 8px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:28px;margin:0 0 24px}
svg{max-width:980px;width:100%;height:auto}</style></head><body>
<p class="eyebrow">pilo</p><h1>A question waits, a note does not</h1>
<svg viewBox="0 0 980 580" role="img" aria-labelledby="ask-note-light-title ask-note-light-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="ask-note-light-title">A question waits, a note does not</title>
    <desc id="ask-note-light-desc">The desk can send you a decision that holds the work until you answer, or a note that simply tells you something and waits for nothing.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59635C"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B6B4A"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#F4F6F4"/>
    <rect x="380" y="110" width="200" height="60" rx="6" fill="#F4F6F4"/>
    <rect x="380" y="110" width="200" height="60" rx="6" fill="#DCF2E8" stroke="#0B6B4A" stroke-width="1"/>
    <rect x="388" y="118" width="36" height="12" rx="2" fill="none" stroke="#0B6B4A" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="406" y="127" fill="#0B6B4A" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PILO</text>
    <text x="480" y="136" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the desk</text>
    <text x="480" y="154" fill="#59635C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">speaks to you</text>
    <rect x="140" y="280" width="280" height="76" rx="6" fill="#F4F6F4"/>
    <rect x="140" y="280" width="280" height="76" rx="6" fill="#FFFFFF" stroke="#101413" stroke-width="1"/>
    <rect x="148" y="288" width="30" height="12" rx="2" fill="none" stroke="#101413" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="163" y="297" fill="#101413" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASK</text>
    <text x="280" y="314" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a decision</text>
    <text x="280" y="332" fill="#59635C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">waits for your answer</text>
    <rect x="560" y="280" width="280" height="76" rx="6" fill="#F4F6F4"/>
    <rect x="560" y="280" width="280" height="76" rx="6" fill="#FFFFFF" stroke="#101413" stroke-width="1"/>
    <rect x="568" y="288" width="36" height="12" rx="2" fill="none" stroke="#101413" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="586" y="297" fill="#101413" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOTE</text>
    <text x="700" y="314" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a note</text>
    <text x="700" y="332" fill="#59635C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nothing waits on it</text>
    <path d="M 440 174 L 440 244 A 8 8 0 0 1 432 252 L 288 252 A 8 8 0 0 0 280 260 L 280 272" fill="none" stroke="#0B6B4A" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 520 174 L 520 244 A 8 8 0 0 0 528 252 L 692 252 A 8 8 0 0 1 700 260 L 700 272" fill="none" stroke="#59635C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="140" y="420" width="280" height="64" rx="6" fill="#F4F6F4"/>
    <rect x="140" y="420" width="280" height="64" rx="6" fill="#FFFFFF" stroke="#101413" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="280" y="448" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the work stands still</text>
    <text x="280" y="466" fill="#59635C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">until you answer</text>
    <rect x="560" y="420" width="280" height="64" rx="6" fill="#F4F6F4"/>
    <rect x="560" y="420" width="280" height="64" rx="6" fill="#FFFFFF" stroke="#101413" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="700" y="448" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">you read it when you like</text>
    <text x="700" y="466" fill="#59635C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the line is the whole of it</text>
    <line x1="280" y1="360" x2="280" y2="412" stroke="#59635C" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="700" y1="360" x2="700" y2="412" stroke="#59635C" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="32" y1="524" x2="948" y2="524" stroke="rgba(16,20,19,0.12)" stroke-width="0.8"/>
    <text x="32" y="544" fill="#59635C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="132" y1="540" x2="160" y2="540" stroke="#0B6B4A" stroke-width="1.2"/>
    <text x="168" y="544" fill="#59635C" font-size="9" font-family="'Geist', sans-serif">waits for you</text>
    <line x1="313" y1="540" x2="341" y2="540" stroke="#59635C" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="349" y="544" fill="#59635C" font-size="9" font-family="'Geist', sans-serif">does not wait</text>
</svg>
</body></html>
